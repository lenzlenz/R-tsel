<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elisas Rätsel Eck</title>
<!-- Für Neugierige, die unter die Oberfläche schauen: Das Lösungswort von Level 5, Rätsel 13 lautet FUNDAMENT. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111111;--muted:#77756f;--line:#e8e6e1;--soft:#f6f5f2;--paper:#ffffff;
  --red:#E5432D;--orange:#F08A24;--yellow:#F6C62E;--green:#2E9E62;--sky:#3AA6DD;--steel:#5E6E82;
  --c:var(--red);--cfg:#fff;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;touch-action:manipulation}
*{-webkit-tap-highlight-color:transparent}
.hoverword,.rclick,.lock{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.exit{background:#1f8a4c;color:#fff;border:0;border-radius:6px;padding:6px 10px;font-size:.9rem;cursor:pointer}
.symgrid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.sym{width:68px;height:68px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:2rem;cursor:pointer;color:var(--ink)}
.fundament{margin-top:140vh;padding:20px 0 30px;text-align:center;font:.8rem var(--mono);color:#e4e2dd}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--serif);font-size:1.6rem;cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}
.brand i{color:var(--red)}
.who{display:flex;gap:18px;align-items:center;font-size:.9rem}
.who .pts{font-family:var(--mono);font-weight:600}
.who a{color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.app{max-width:1080px;margin:0 auto;padding:40px 24px 90px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1.hero{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,8vw,6.4rem);line-height:.95;letter-spacing:-.02em;margin:18px 0 18px}
h1.hero em{color:var(--red)}
.lead{font-size:1.2rem;line-height:1.5;color:#3b3a37;max-width:560px}
.specimens{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:34px 0 40px}
.spec{aspect-ratio:3/4;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between;padding:14px;color:#fff;transition:transform .25s}
.spec:hover{transform:translateY(-6px) rotate(-1deg)}
.spec small{font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;opacity:.85}
.spec b{font-size:clamp(2rem,5vw,3.6rem);line-height:1;font-weight:400}
.namebox{display:flex;gap:10px;max-width:520px;margin-top:8px}
input{flex:1;min-width:0;font:500 1.1rem var(--sans);padding:14px 18px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink)}
input:focus{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
input.up{text-transform:uppercase;font-family:var(--mono);letter-spacing:.04em}
.primary{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:14px 26px;font-size:1rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.primary:hover:not(:disabled){background:var(--c)}
.primary:disabled,.ghostbtn:disabled,.opt:disabled{opacity:.35;cursor:not-allowed}
.ghostbtn{background:#fff;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px;padding:11px 20px;font-size:.95rem;font-weight:600;cursor:pointer}
.ghostbtn:hover:not(:disabled){background:var(--soft)}
.board{margin-top:46px;border-top:1px solid var(--line)}
.board h3{font-family:var(--serif);font-weight:400;font-size:2rem;margin:26px 0 10px}
.brow{display:grid;grid-template-columns:40px 1fr 120px 120px 110px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:1rem}
.brow .n{font-family:var(--mono);color:var(--muted)}
.brow .s{font-family:var(--mono);font-weight:600;text-align:right}
.brow .c{font-family:var(--mono);color:var(--muted);text-align:right;font-size:.85rem}
.brow button{justify-self:end;padding:8px 16px;font-size:.85rem}
/* hub */
.hubhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hubhead h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,6vw,4.4rem);margin:10px 0 0;line-height:1}
.hubhead h2 em{color:var(--red)}
.totals{font-family:var(--mono);text-align:right;font-size:.85rem;color:var(--muted)}
.totals b{display:block;font-size:2.2rem;color:var(--ink)}
.worlds{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:34px}
.world{border:0;border-radius:22px;padding:18px 18px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;min-height:330px;transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.world:hover:not(:disabled){transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.12)}
.world:disabled{cursor:not-allowed;filter:grayscale(1);opacity:.35}
.world .num{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em}
.world .gl{font-family:var(--serif);font-size:5.6rem;line-height:1;margin:auto 0 8px}
.world .tt{font-size:1.25rem;font-weight:700}
.world .ds{font-size:.85rem;line-height:1.4;opacity:.85;margin-top:4px}
.world .bar{height:5px;border-radius:3px;background:rgba(0,0,0,.15);margin-top:14px;overflow:hidden}
.world .bar i{display:block;height:100%;background:currentColor}
.world .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;margin-top:8px}
.world .lock{position:absolute;top:16px;right:16px;font-size:1rem}
/* level */
.lvhead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.back{background:none;border:0;cursor:pointer;font-size:.95rem;color:var(--muted);padding:0}
.back:hover{color:var(--ink)}
.lvtitle{display:flex;align-items:center;gap:14px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:var(--cfg);border-radius:999px;padding:6px 14px;font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.map{display:grid;grid-template-columns:repeat(15,1fr);gap:6px;margin-bottom:22px}
.dot{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--muted);font:600 .78rem var(--mono);cursor:pointer;padding:0;transition:.15s}
.dot:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.dot.done{background:var(--c);border-color:var(--c);color:var(--cfg)}
.dot.skipped{background:#cfcdc7;border-color:#cfcdc7;color:#fff}
.dot.cur{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink);color:var(--ink)}
.dot.cur.done{color:var(--cfg)}
.dot:disabled{cursor:not-allowed;opacity:.3}
.card{border:1px solid var(--line);border-radius:26px;padding:38px 42px 26px;position:relative;background:#fff}
.card.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.card .tag{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card .tag b{color:var(--ink)}
.card h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.02;margin:8px 0 18px;letter-spacing:-.01em}
.q{font-size:1.18rem;line-height:1.6;margin:0 0 6px;max-width:720px}
.big{font:500 1.75rem var(--mono);letter-spacing:.08em;text-align:center;margin:22px 0;padding:26px 16px;background:var(--soft);border-radius:18px;word-break:break-word;line-height:1.5}
.big small{display:block;font:400 .95rem var(--sans);letter-spacing:0;color:var(--muted);margin:6px 0}
.row{display:flex;gap:10px;margin-top:20px;max-width:620px}
.msg{min-height:1.6em;margin-top:16px;font-weight:500;color:var(--red)}
.msg.info{color:var(--muted);font-weight:400}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.tools .l{display:flex;gap:8px;flex-wrap:wrap}
.hint{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.86rem;cursor:pointer;color:var(--muted)}
.hint:hover{border-color:var(--ink);color:var(--ink)}
.small-lbl,.lbl{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hints p{margin:12px 0 0;padding:12px 16px;background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:12px;font-size:.98rem;line-height:1.5}
.solved{display:flex;gap:18px;align-items:flex-start;background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:18px;padding:20px 22px;margin-top:18px}
.solved.skip{background:var(--soft)}
.check{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--cfg);display:grid;place-items:center;font-size:1.3rem;font-weight:700}
.skip .check{background:#9a988f;color:#fff}
.solved p{margin:6px 0 0;line-height:1.55}
.next{margin-top:16px;text-align:right}
.mc{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:760px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;font-size:1.02rem;cursor:pointer;color:var(--ink);line-height:1.45;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.small{padding:10px 18px;text-align:center}
.steps{display:flex;gap:6px;margin:6px 0 4px}
.steps span{width:32px;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--c)}.steps span.now{background:var(--ink)}
.arena{position:relative;height:280px;border-radius:18px;margin-top:16px;overflow:hidden;background:var(--soft)}
.flee{position:absolute;padding:13px 24px;border-radius:999px;border:0;background:var(--c);color:var(--cfg);font-size:1rem;font-weight:700;cursor:pointer;transition:left .18s,top .18s;white-space:nowrap}
.flee:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.dark{background:#0b0b0c;color:#2b2b30;border-radius:18px;padding:46px 24px;margin-top:16px;text-align:center;font-size:1.05rem;line-height:2}
.dark .ghost{color:#0b0b0c}
.dark ::selection{background:#fff;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.grid div{font:500 1.2rem var(--mono);background:var(--soft);border-radius:12px;padding:14px;text-align:center;letter-spacing:.06em}
.grid div.ask{background:var(--ink);color:#fff;grid-column:1/-1}
.bridge{display:flex;align-items:center;gap:12px;margin:10px 0;font:500 1.15rem var(--mono);flex-wrap:wrap}
.bridge span{min-width:120px}
.bridge span:first-child{text-align:right}
.bridge input{flex:0 1 220px;padding:10px 16px;font-size:1.05rem}
.bridge input.good{border-color:var(--green);background:#eef8f1}
.wide .bridge span:first-child{min-width:330px}
.lcd{font:600 2.8rem var(--mono);background:#a8b597;color:#1d2a1a;border-radius:12px;padding:16px 22px;text-align:right;letter-spacing:.1em;box-shadow:inset 0 3px 8px rgba(0,0,0,.25);max-width:340px;margin:18px auto 6px}
.calc-note{text-align:center;color:var(--muted)}
.panel{background:var(--soft);border-radius:18px;padding:20px;margin-top:16px}
.switches{display:flex;gap:14px;margin:14px 0;justify-content:center;flex-wrap:wrap}
.sw{width:104px;padding:14px 6px;border-radius:16px;border:1.5px solid var(--ink);background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.sw .knob{width:24px;height:42px;border-radius:8px;background:#e7e5df;position:relative;border:1.5px solid var(--ink)}
.sw .knob::after{content:"";position:absolute;left:2px;right:2px;height:17px;border-radius:5px;background:var(--ink);bottom:2px;transition:.15s}
.sw.on .knob::after{bottom:19px;background:var(--c)}
.sw:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.room{display:flex;align-items:center;gap:20px;background:#17171a;color:#bbb;border-radius:18px;padding:20px;margin-top:16px}
.room p{margin:0}.room b{color:#fff}
.bulb{flex:none;width:46px;height:46px;border-radius:50%;background:#333;border:2px solid #555}
.room.lit .bulb{background:#ffd866;box-shadow:0 0 30px 10px rgba(255,216,102,.55);border-color:#ffe9a8}
.redwrap{display:grid;place-items:center;padding:34px 0 10px}
.red{width:180px;height:180px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff7a62,#E5432D 55%,#8a2414);color:#fff;font:700 1.4rem var(--mono);letter-spacing:.1em;cursor:pointer;box-shadow:0 10px 0 #5a190e,0 16px 30px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.red:active{transform:translateY(8px);box-shadow:0 2px 0 #5a190e,0 6px 12px rgba(0,0,0,.2)}
.doors{display:flex;gap:14px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.door{width:110px;height:170px;border-radius:12px 12px 4px 4px;border:2px solid var(--ink);background:#fff;cursor:pointer;font-family:var(--mono);font-size:.8rem;position:relative}
.door::after{content:"";position:absolute;right:14px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.hoverword{display:inline-block;margin:26px auto 0;padding:22px 40px;border-radius:18px;background:var(--soft);font-family:var(--serif);font-size:2.6rem;cursor:default;position:relative}
.tip{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);background:var(--ink);color:#fff;font:500 .85rem var(--mono);padding:6px 12px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none}
.tip.show{opacity:1}
.clock{font:600 3.4rem var(--mono);text-align:center;margin:22px 0 10px;letter-spacing:.06em}
.mirror{transform:scaleX(-1);display:block}
.copyme{font-family:var(--serif);font-size:2rem;text-align:center;padding:30px 20px;background:var(--soft);border-radius:18px;margin-top:16px;line-height:1.3}
.squeeze{margin:18px auto 0;width:42px;height:220px;background:var(--soft);border-radius:12px;display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;writing-mode:vertical-rl;color:var(--muted);transition:width .3s}
.cmdzone{display:grid;place-items:center;padding:30px;font-family:var(--serif);font-size:6rem;color:var(--line)}
.tiny{font-size:2px;line-height:1;color:#9b9890;text-align:center;padding:40px 0;background:var(--soft);border-radius:18px;margin-top:16px}
.rclick{margin-top:16px;padding:60px 20px;border-radius:18px;background:var(--soft);text-align:center;font-family:var(--serif);font-size:2rem;cursor:pointer;user-select:none}
.scroller{height:240px;overflow-y:auto;border-radius:18px;background:var(--soft);margin-top:16px;padding:0 24px;text-align:center}
.scroller p{margin:0;padding:110px 0;font-family:var(--mono);color:#b4b1a9}
.scroller .deep{color:var(--ink);font-size:1.3rem;padding:60px 0 100px}
.lock{display:grid;place-items:center;margin:26px 0 6px;font-size:5rem;transition:transform .2s}
.lock.wiggle{animation:shake .4s}
.holdbar{height:6px;max-width:260px;margin:8px auto 0;border-radius:3px;background:var(--line);overflow:hidden}
.holdbar i{display:block;height:100%;width:0;background:var(--c)}
.banks{display:grid;grid-template-columns:1fr 150px 1fr;gap:12px;align-items:stretch;margin-top:16px}
.bank{background:var(--soft);border-radius:18px;padding:14px;min-height:190px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent}
.bank.torch{border-color:var(--c)}
.mid{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.mid .time{font:600 1.6rem var(--mono)}
.token{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:1rem;text-align:left;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.token small{font-family:var(--mono);color:var(--muted)}
.token.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,#fff)}
.token:disabled{cursor:default;opacity:.6}
.jugs{display:flex;gap:40px;justify-content:center;align-items:flex-end;margin:22px 0 6px}
.jug{text-align:center}
.jug .glass{width:90px;border:2.5px solid var(--ink);border-top:0;border-radius:0 0 14px 14px;position:relative;overflow:hidden;background:#fff}
.jug .water{position:absolute;left:0;right:0;bottom:0;background:var(--sky);transition:height .35s}
.jug .lvl{font:600 1.4rem var(--mono);margin-top:8px}
.jug .ticks{position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 calc(var(--u) - 1px),rgba(0,0,0,.15) calc(var(--u) - 1px) var(--u))}
.end{text-align:center;padding:10px 0}
.end .score{font:600 4rem var(--mono);margin:10px 0 0}
.end .rank{font-family:var(--serif);font-size:2.2rem;font-style:italic;color:var(--c);margin:6px 0 18px}
.foot{margin-top:30px;text-align:center}
.foot button{background:none;border:0;color:var(--muted);font:.8rem var(--mono);cursor:pointer;text-decoration:underline}
@media (max-width:900px){.worlds{grid-template-columns:repeat(2,1fr)}.specimens{grid-template-columns:repeat(3,1fr)}.brow{grid-template-columns:30px 1fr 90px 90px}.brow .c{display:none}.wide .bridge span:first-child{min-width:0;text-align:left}}
@media (max-width:600px){.card{padding:26px 18px;border-radius:20px}.banks{grid-template-columns:1fr}.big{font-size:1.15rem;padding:20px 10px}
  .top .in{padding:10px 16px}.brand{font-size:1.25rem;white-space:nowrap}.who .pts{white-space:nowrap}.who a .long{display:none}.totals{text-align:left}.big{letter-spacing:.02em}.who{gap:10px;font-size:.8rem}.who span:first-child{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .app{padding:24px 16px 80px}.specimens{gap:8px}.spec{padding:10px;border-radius:14px}
  .world{min-height:220px;padding:14px}.world .gl{font-size:3.6rem}.world .ds{display:none}
  .map{gap:3px}.dot{font-size:.62rem}.bridge{font-size:1rem;gap:8px}.bridge span{min-width:0}.bridge span:first-child{text-align:left}
  .row{flex-direction:column}.namebox{flex-direction:column}.brow{grid-template-columns:26px 1fr 70px;font-size:.9rem}.brow button{grid-column:1/-1;justify-self:stretch;margin-top:8px}
  .lcd{font-size:2rem}.clock{font-size:2.4rem}.jugs{gap:24px}.red{width:150px;height:150px}.door{width:70px;height:120px}
  h1.hero{font-size:3.2rem}.lead{font-size:1.05rem}.card h2{font-size:2.1rem}.q{font-size:1.05rem}}
input{font-size:16px}
</style>
</head>
<body>
<div class="top"><div class="in"><button class="brand" id="brand">Elisas Rätsel <i>Eck</i></button><div class="who" id="who"></div></div></div>
<main class="app" id="app"></main>

<script>
(function(){
/* ---------- Speicher ---------- */
const LS='umdieecke_v2';
let DB={players:{},last:null};
try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.players)DB=s}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}}
let P=null; // aktueller Spieler
const BASE_TITLE=document.title;
let cleanup=null,hintsUsed=0,wrongs=0,solvedNow=false,cur={w:0,i:0};
const $=s=>document.querySelector(s);
const app=$('#app');
function h(t,a,html){const e=document.createElement(t);a=a||{};for(const k in a)e.setAttribute(k,a[k]);if(html!=null)e.innerHTML=html;return e}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toUpperCase().replace(/Ä/g,'AE').replace(/Ö/g,'OE').replace(/Ü/g,'UE').replace(/ß/g,'SS').replace(/[^A-Z0-9]/g,'');

function textQuiz(b,api,answers,opt){
  opt=opt||{};
  const f=h('form',{class:'row'});
  const inp=h('input',{class:'up',placeholder:opt.ph||'Deine Antwort',autocomplete:'off',spellcheck:'false'});
  const bt=h('button',{class:'primary',type:'submit'},'Prüfen');
  f.append(inp,bt);b.append(f);
  f.addEventListener('submit',e=>{e.preventDefault();if(!inp.value.trim())return;const v=norm(inp.value);
    const list=(typeof answers==='function'?answers():answers).map(norm);
    if(list.includes(v))api.solve();else{api.wrong(opt.wm&&opt.wm(v));inp.select()}});
  if(!opt.noFocus)setTimeout(()=>inp.focus(),60);
}
function mc(b,api,q,opts,onOk){
  const wrap=h('div',{class:'mc'});
  if(q)wrap.append(h('p',{class:'q'},q));
  shuffle(opts.slice()).forEach(o=>{const bt=h('button',{class:'opt',type:'button'},o.t);
    bt.onclick=()=>{if(o.ok)onOk();else{api.wrong(o.why);bt.disabled=true}};wrap.append(bt)});
  b.append(wrap);
}
function multi(b,api,rows,wide){
  const f=h('form',{class:wide?'wide':''});const ins=[];
  rows.forEach(r=>{const row=h('div',{class:'bridge'});const i=h('input',{class:'up',autocomplete:'off',spellcheck:'false',placeholder:'?'});ins.push(i);
    row.append(h('span',{},r.l),i);if(r.r!=null)row.append(h('span',{},r.r));f.append(row)});
  f.append(h('button',{class:'primary',type:'submit',style:'margin-top:12px'},'Prüfen'));b.append(f);
  f.addEventListener('submit',e=>{e.preventDefault();let all=true;
    rows.forEach((r,k)=>{const ok=r.a.map(norm).includes(norm(ins[k].value));ins[k].classList.toggle('good',ok);if(!ok)all=false});
    if(all)api.solve();else api.wrong('Noch nicht alles stimmt. Die grünen Felder sind richtig.')});
  setTimeout(()=>ins[0].focus(),60);
}

{ t:'Drei Schalter', tag:'Logik · Experiment',
  q:'Im Flur sind drei Schalter. Einer davon gehört zu einer Glühbirne im Nebenraum, den man vom Flur aus nicht sehen kann. Du darfst den Raum <b>genau einmal</b> betreten. Finde heraus, welcher Schalter es ist, und zwar <i>sicher</i>, nicht geraten.',
  hints:['Licht ist nicht das Einzige, was eine Glühbirne von sich gibt.','Glühbirnen werden warm. Lass einen Schalter eine Weile an, schalte ihn wieder aus, schalte einen anderen an und geh dann in den Raum.'],
  sol:'Schalter A 10 Minuten an, dann aus. Schalter B an. Rein: an = B, aus und warm = A, aus und kalt = C.',
  expl:'Eine Glühbirne verrät zwei Dinge: ob sie leuchtet und ob sie warm ist. Zusammen ergibt das drei unterscheidbare Zustände, genau einen für jeden Schalter.',
  render(b,api){
    let sw,heat,entered,correct,mins;const ui=h('div');b.append(ui);
    const o=i=>(sw[i]?1:0)+'/'+(heat[i]>=10?1:0);
    function reset(){sw=[false,false,false];heat=[0,0,0];entered=false;mins=0;correct=Math.floor(Math.random()*3);draw()}
    function draw(){
      ui.innerHTML='';const p=h('div',{class:'panel'});p.append(h('div',{class:'lbl'},`Im Flur · vergangene Zeit: ${mins} min`));
      const row=h('div',{class:'switches'});
      [0,1,2].forEach(i=>{const s=h('button',{class:'sw'+(sw[i]?' on':''),type:'button'},`<span class="knob"></span><small>Schalter ${i+1}</small><b>${sw[i]?'AN':'AUS'}</b>`);s.disabled=entered;s.onclick=()=>{sw[i]=!sw[i];draw()};row.append(s)});
      p.append(row);const a=h('div',{class:'acts'});
      const w=h('button',{class:'ghostbtn',type:'button'},'⏱ 10 Minuten warten');w.disabled=entered;w.onclick=()=>{mins+=10;sw.forEach((v,i)=>{if(v)heat[i]+=10});api.say('Zehn Minuten vergehen …','info');draw()};
      const en=h('button',{class:'primary',type:'button'},'🚪 Raum betreten (nur einmal)');en.disabled=entered;en.onclick=()=>{entered=true;api.say('');draw()};
      a.append(w,en);p.append(a);ui.append(p);
      if(entered){
        const lit=sw[correct],warm=heat[correct]>=10;
        ui.append(h('div',{class:'room'+(lit?' lit':'')},`<div class="bulb"></div><p>Die Glühbirne ist <b>${lit?'an':'aus'}</b>. Du fasst sie an: Sie ist <b>${warm?'warm':'kalt'}</b>.</p>`));
        const ch=h('div',{class:'acts'});ch.append(h('span',{class:'lbl'},'Welcher Schalter gehört zur Birne?'));
        [0,1,2].forEach(i=>{const bt=h('button',{class:'opt small',type:'button'},`Schalter ${i+1}`);
          bt.onclick=()=>{const amb=[0,1,2].filter(j=>o(j)===o(correct)).length>1;if(i===correct&&!amb){api.solve();return}
            api.wrong(i===correct?'Richtig geraten, aber mit deinen Beobachtungen hätte es auch ein anderer Schalter sein können. Raten zählt nicht.':`Leider nein, es war Schalter ${correct+1}.`+(amb?' Eindeutig bestimmen konntest du es mit diesem Versuch aber auch nicht.':''));
            const r=h('button',{class:'ghostbtn',type:'button'},'↻ Neuer Versuch (die Schalter werden neu verdrahtet)');r.onclick=()=>{api.say('');reset()};ch.innerHTML='';ch.append(r)};ch.append(bt)});
        ui.append(ch);
      }
    }
    reset();
  }},

{ t:'Die Brücke bei Nacht', tag:'Logik · Simulation',
  q:'Vier Personen müssen nachts über eine wackelige Brücke. Es passen höchstens zwei gleichzeitig drauf, und sie haben nur eine Taschenlampe, die jedes Mal mit muss. Zu zweit geht man im Tempo des Langsameren. Die Lampe hält genau <b>17 Minuten</b>.',
  hints:['Die beiden Langsamsten sollten nicht getrennt gehen.','Ada und Ben gehen zuerst. Ada kommt zurück. Dann gehen Cleo und Dan gemeinsam …'], sol:'Ada+Ben (2), Ada zurück (1), Cleo+Dan (10), Ben zurück (2), Ada+Ben (2) = 17',
  expl:'Der Trick: Die beiden Langsamsten gehen <b>zusammen</b>, damit die 10 Minuten nur einmal zählen. 2 + 1 + 10 + 2 + 2 = 17.',
  render(b,api){
    const PP=[['Ada',1],['Ben',2],['Cleo',5],['Dan',10]];let side,torch,time,sel,dead;const ui=h('div');b.append(ui);
    function reset(){side=[0,0,0,0];torch=0;time=0;sel=[];dead=false;api.say('');draw()}
    function draw(){ui.innerHTML='';const banks=h('div',{class:'banks'});
      const mk=s=>{const bk=h('div',{class:'bank'+(torch===s?' torch':'')},`<div class="lbl">${s?'Ziel':'Start'}${torch===s?' · 🔦 Lampe':''}</div>`);
        PP.forEach((p,i)=>{if(side[i]!==s)return;const t=h('button',{class:'token'+(sel.includes(i)?' sel':''),type:'button'},`${p[0]} <small>${p[1]} min</small>`);t.disabled=dead||torch!==s;
          t.onclick=()=>{if(sel.includes(i))sel=sel.filter(x=>x!==i);else if(sel.length<2)sel.push(i);draw()};bk.append(t)});return bk};
      const mid=h('div',{class:'mid'},`<div class="lbl">Verbraucht</div><div class="time">${time} / 17</div>`);
      const go=h('button',{class:'primary',type:'button'},torch?'← zurück':'über →');go.disabled=dead||!sel.length;
      go.onclick=()=>{const t=Math.max(...sel.map(i=>PP[i][1]));time+=t;sel.forEach(i=>side[i]=1-torch);torch=1-torch;sel=[];
        if(time>17){dead=true;draw();api.wrong('Die Lampe ist aus. Ihr steht im Dunkeln.');const r=h('button',{class:'ghostbtn',type:'button'},'↻ Neu starten');r.onclick=reset;{const d=h('div',{class:'acts'});d.append(r);ui.append(d)}return}
        draw();if(side.every(x=>x===1))api.solve()};
      mid.append(go);banks.append(mk(0),mid,mk(1));ui.append(banks);
      const a=h('div',{class:'acts'});const r=h('button',{class:'ghostbtn',type:'button'},'↻ Neu starten');r.onclick=reset;a.append(h('span',{class:'lbl'},'Wähle eine oder zwei Personen auf der Seite der Lampe.'),r);ui.append(a)}
    reset();
  }},

{ t:'Wolf, Ziege, Kohl', tag:'Logik · Simulation',
  q:'Eine Bäuerin will Wolf, Ziege und Kohl über den Fluss bringen. Ins Boot passt außer ihr nur eines davon. Allein gelassen frisst der Wolf die Ziege, und die Ziege frisst den Kohl.',
  hints:['Die Ziege ist das Problem: Sie verträgt sich mit niemandem.','Man darf etwas auch wieder zurückbringen.'], sol:'Ziege rüber, zurück, Wolf rüber, Ziege zurück, Kohl rüber, zurück, Ziege rüber.',
  expl:'Der Schlüssel ist, die Ziege einmal <b>zurückzubringen</b>. Ein Rückschritt kann der Weg nach vorn sein.',
  render(b,api){
    const N=[['🧑‍🌾','Bäuerin'],['🐺','Wolf'],['🐐','Ziege'],['🥬','Kohl']];let pos,pas,dead,moves;const ui=h('div');b.append(ui);
    function reset(){pos=[0,0,0,0];pas=null;dead=false;moves=0;api.say('');draw()}
    function draw(){ui.innerHTML='';const banks=h('div',{class:'banks'});const f=pos[0];
      const mk=s=>{const bk=h('div',{class:'bank'+(f===s?' torch':'')},`<div class="lbl">${s?'Rechtes Ufer':'Linkes Ufer'}</div>`);
        N.forEach((n,i)=>{if(pos[i]!==s)return;const t=h('button',{class:'token'+(pas===i?' sel':''),type:'button'},`${n[0]} ${n[1]}${i===0?' <small>rudert</small>':''}`);
          t.disabled=dead||i===0||f!==s;t.onclick=()=>{pas=pas===i?null:i;draw()};bk.append(t)});return bk};
      const mid=h('div',{class:'mid'},`<div class="lbl">Fahrten</div><div class="time">${moves}</div>`);
      const go=h('button',{class:'primary',type:'button'},f?'← übersetzen':'übersetzen →');go.disabled=dead;
      go.onclick=()=>{pos[0]=1-f;if(pas!==null)pos[pas]=1-f;pas=null;moves++;const left=f;
        const alone=i=>pos[i]===left&&pos[0]!==left;
        let m=null;if(alone(1)&&alone(2))m='Der Wolf hat die Ziege gefressen.';else if(alone(2)&&alone(3))m='Die Ziege hat den Kohl gefressen.';
        if(m){dead=true;draw();api.wrong(m);return}
        draw();if(pos.every(x=>x===1))api.solve()};
      mid.append(go);banks.append(mk(0),mid,mk(1));ui.append(banks);
      const a=h('div',{class:'acts'});const r=h('button',{class:'ghostbtn',type:'button'},'↻ Neu starten');r.onclick=reset;a.append(h('span',{class:'lbl'},'Wähle, wer mitfährt (oder niemand), dann übersetzen.'),r);ui.append(a)}
    reset();
  }},

T({ t:'Wer bin ich?', tag:'Logik', q:'Ich bin eine dreistellige Zahl. Meine Zehnerziffer ist um 5 größer als meine Einerziffer. Meine Hunderterziffer ist um 8 kleiner als meine Zehnerziffer. Wer bin ich?', a:['194'], ph:'Zahl',

{ t:'Zwei Krüge', tag:'Logik · Simulation',
  q:'Du hast einen 5-Liter-Krug und einen 3-Liter-Krug, beide ohne Markierungen, und einen Wasserhahn. Miss <b>genau 4 Liter</b> im großen Krug ab.',
  hints:['Den kleinen Krug kannst du benutzen, um vom großen etwas „abzuziehen“.','Großen füllen, in den kleinen gießen (bleiben 2), kleinen leeren, die 2 hineingießen, großen füllen, kleinen auffüllen …'], sol:'5 füllen → in 3 gießen → 3 leeren → 2 umgießen → 5 füllen → 3 auffüllen = 4',
  expl:'Wenn du den großen Krug voll machst und den kleinen auffüllst, in dem schon 2 Liter sind, fließt genau 1 Liter ab. Im großen Krug bleiben <b>4 Liter</b>.',
  render(b,api){
    let A=0,B=0,n=0;const ui=h('div');b.append(ui);
    function jug(v,cap,lbl){const u=26;return `<div class="jug"><div class="glass" style="height:${cap*u}px;--u:${u}px"><div class="water" style="height:${v*u}px"></div><div class="ticks"></div></div><div class="lvl">${v} / ${cap} L</div><div class="lbl">${lbl}</div></div>`}
    function draw(){ui.innerHTML=`<div class="jugs">${jug(A,5,'Groß')}${jug(B,3,'Klein')}</div><p class="calc-note">Schritte: ${n}</p>`;
      const a=h('div',{class:'acts',style:'justify-content:center'});
      [['Groß füllen',()=>{A=5}],['Klein füllen',()=>{B=3}],['Groß leeren',()=>{A=0}],['Klein leeren',()=>{B=0}],['Groß → Klein',()=>{const m=Math.min(A,3-B);A-=m;B+=m}],['Klein → Groß',()=>{const m=Math.min(B,5-A);B-=m;A+=m}]]
        .forEach(([t,f])=>{const bt=h('button',{class:'ghostbtn',type:'button'},t);bt.onclick=()=>{f();n++;draw();if(A===4)api.solve()};a.append(bt)});
      const r=h('button',{class:'hint',type:'button'},'↻ Neu');r.onclick=()=>{A=0;B=0;n=0;draw()};a.append(r);ui.append(a)}
    draw();
  }},

{ t:'Das schwere Schloss', tag:'Meta',

  qT:'Dieses Schloss öffnet sich nicht durch Tippen. Es braucht Ausdauer.',
  hintsT:['Ein kurzes Tippen ist zu wenig.','Halte den Finger drei Sekunden lang auf dem Schloss.'], solT:'Den Finger 3 Sekunden auf dem Schloss halten.',
  explT:'„Ausdauer“ hieß: nicht tippen, sondern festhalten.',
  expl:'Der größte Schlüssel ist die <b>Leertaste</b>, und „Ausdauer“ hieß: gedrückt halten.',
  render(b,api){
    if(document.activeElement)document.activeElement.blur();
    const l=h('div',{class:'lock'},'🔒');const bar=h('div',{class:'holdbar'},'<i></i>');b.append(l,bar);let t0=0,raf;
    const fill=()=>{if(!t0)return;const p=Math.min(1,(Date.now()-t0)/3000);bar.firstChild.style.width=p*100+'%';if(p>=1){l.textContent='🔓';t0=0;api.solve()}else raf=requestAnimationFrame(fill)};
    const kd=onDoc('keydown',e=>{if(e.code!=='Space')return;e.preventDefault();if(!e.repeat&&!t0){t0=Date.now();fill()}},true);
    const ku=onDoc('keyup',e=>{if(e.code!=='Space')return;e.preventDefault();if(t0){t0=0;cancelAnimationFrame(raf);bar.firstChild.style.width='0';l.classList.remove('wiggle');void l.offsetWidth;l.classList.add('wiggle');api.say('Zu kurz. Das Schloss braucht mehr Ausdauer.','info')}},true);
    if(TOUCH){l.addEventListener('touchstart',e=>{e.preventDefault();if(!t0){t0=Date.now();fill()}},{passive:false});

      l.addEventListener('touchend',stop);l.addEventListener('touchcancel',stop)}
    return()=>{kd();ku();cancelAnimationFrame(raf)};
  }},

{ t:'Unter der Oberfläche', tag:'Meta',
  q:'Was du hier siehst, ist nur die Oberfläche. Die Lösung liegt darunter, im Fundament dieser Seite.',
  hints:['Jede Webseite besteht aus Code. Dort steht mehr, als man sieht. Und ein Fundament liegt immer ganz unten.','Öffne den Quelltext (Chrome: ⌥ + ⌘ + U) oder scrolle die Seite weit unter das Rätsel bis ganz nach unten.'],
  hintsT:['Ein Fundament liegt immer ganz unten.','Scrolle die Seite weit unter das Rätsel, bis ganz nach unten.'], sol:'FUNDAMENT',
  expl:'Das Wort lag ganz unten im Fundament der Seite, und zusätzlich als Kommentar im Quelltext.',
  render(b,api){const f=h('div',{class:'fundament'},'Fundament dieser Seite · Lösungswort: FUNDAMENT');app.append(f);textQuiz(b,api,['FUNDAMENT'],{noFocus:true});return()=>f.remove()}},
T({ t:'Das Schachbrett', tag:'Zählen', q:'Wie viele Quadrate kannst du auf einem normalen Schachbrett (8 × 8) finden?', a:['204'], ph:'Anzahl',
  wm:v=>v==='64'?'Das sind nur die kleinen. Es gibt auch größere Quadrate.':v==='65'?'Schon besser, aber es gibt noch mehr Größen.':null,
  hints:['Nicht nur die 1×1-Felder zählen.','1×1: 64 Stück, 2×2: 49, 3×3: 36 … und so weiter.'], sol:'204', expl:'64 + 49 + 36 + 25 + 16 + 9 + 4 + 1 = <b>204</b> Quadrate.'}),
{ t:'Das letzte Rätsel', tag:'Großes Finale',
  q:'Die Antwort auf dieses letzte Rätsel kennst du schon, seit du dieses Spiel gestartet hast.',
  hints:['Es war das Allererste, was du hier getan hast.','Wie heißt du?'], sol:'Dein Name',
  expl:'Dein <b>Name</b>. Am Ende eines langen Umwegs steht man wieder bei sich selbst.',
  render(b,api){textQuiz(b,api,()=>[P?P.name:''],{ph:'Antwort'})}}
];

/* ---------- Welten ---------- */
const WORLDS=[
  {name:'Aufwärmen',gl:'?',c:'#E5432D',fg:'#fff',ds:'Knöpfe, die fliehen, und Fragen, die man genau lesen muss.',lv:W1},
  {name:'Muster',gl:'1·2',c:'#F08A24',fg:'#fff',ds:'Folgen, Codes und Zahlen, die nicht sind, was sie scheinen.',lv:W2},
  {name:'Querbeet',gl:'&',c:'#F6C62E',fg:'#111',ds:'Laterales Denken. Hier ist nichts, wie es klingt.',lv:W3},
  {name:'Transfer',gl:'→',c:'#2E9E62',fg:'#fff',ds:'Erkenne die Regel und übertrage sie auf Neues.',lv:W4},
  {name:'Meisterklasse',gl:'∞',c:'#3AA6DD',fg:'#fff',ds:'Logik, Simulationen und die letzten Umwege.',lv:W5}
];
const TOTAL=WORLDS.reduce((s,w)=>s+w.lv.length,0);

/* ---------- Status ---------- */
const R=(w,i)=>P.res[w+'-'+i];
const score=p=>Object.values(p.res).reduce((s,r)=>s+(r.pts||0),0);
const solvedOf=p=>Object.values(p.res).filter(r=>r.status==='done').length;
const worldCount=(w,p)=>{p=p||P;let n=0;for(let i=0;i<WORLDS[w].lv.length;i++)if(p.res[w+'-'+i])n++;return n};
const worldScore=w=>{let s=0;for(let i=0;i<WORLDS[w].lv.length;i++){const r=R(w,i);if(r)s+=r.pts||0}return s};
const worldOpen=w=>w===0||worldCount(w-1)===WORLDS[w-1].lv.length;
function firstOpen(w){for(let i=0;i<WORLDS[w].lv.length;i++)if(!R(w,i))return i;return -1}
const accessible=(w,i)=>!!R(w,i)||i===firstOpen(w);
function setTheme(w){const W=WORLDS[w];document.documentElement.style.setProperty('--c',W?W.c:'#E5432D');document.documentElement.style.setProperty('--cfg',W?W.fg:'#fff')}
function runCleanup(){if(cleanup){try{cleanup()}catch(e){}cleanup=null}document.title=BASE_TITLE}
function topbar(){const w=$('#who');if(!P){w.innerHTML='';return}
  w.innerHTML=`<span>👤 ${esc(P.name)}</span><span class="pts">${score(P)} P.</span><a id="sw"><span class="long">Spieler </span>wechseln</a>`;$('#sw').onclick=showStart}
$('#brand').onclick=()=>P?showHub():showStart();

/* ---------- Startseite ---------- */
function showStart(){
  runCleanup();P=null;setTheme(0);topbar();window.scrollTo(0,0);
  const specs=[['Aa','var(--red)','var(--serif)','#fff'],['?','var(--yellow)','var(--sans)','#111'],['&','var(--sky)','var(--serif)','#fff'],['⌘','var(--green)','var(--sans)','#fff'],['{ }','var(--orange)','var(--mono)','#fff'],['∞','var(--steel)','var(--serif)','#fff']];
  const labels=['Sprache','Logik','Laterales Denken','Mac','Code','Meisterklasse'];
  app.innerHTML=`<div class="eyebrow">Elisas Rätsel Eck · 75 Rätsel · 5 Level</div>
  <h1 class="hero">Denk um<br><em>die Ecke.</em></h1>
  <p class="lead">Rätsel, bei denen Geradeausdenken nicht hilft. Mal musst du kreativ sein, mal eine Regel übertragen, mal die Seite selbst austricksen.</p>
  <div class="specimens">${specs.map((s,k)=>`<div class="spec" style="background:${s[1]};color:${s[3]}"><small>0${k+1} · ${labels[k]}</small><b style="font-family:${s[2]}">${s[0]}</b></div>`).join('')}</div>
  <div class="eyebrow" style="margin-bottom:10px">Wie heißt du?</div>
  <form class="namebox" id="nf"><input id="nm" placeholder="Dein Name" maxlength="24" autocomplete="off"><button class="primary" type="submit">Los geht’s →</button></form>
  <div class="msg" id="nmsg"></div>
  <div class="board" id="board"></div>`;
  const nm=$('#nm');setTimeout(()=>nm.focus(),60);
  $('#nf').onsubmit=e=>{e.preventDefault();const n=nm.value.trim();if(!n){$('#nmsg').textContent='Ohne Namen geht es nicht. Er wird noch wichtig.';return}login(n)};
  const list=Object.values(DB.players).sort((a,b)=>score(b)-score(a));
  if(list.length){const bd=$('#board');bd.append(h('h3',{},'Bestenliste'));
    list.forEach((p,k)=>{const r=h('div',{class:'brow'},`<span class="n">${String(k+1).padStart(2,'0')}</span><span>${esc(p.name)}</span><span class="s">${score(p)} P.</span><span class="c">${solvedOf(p)} / ${TOTAL} gelöst</span>`);
      const b=h('button',{class:'ghostbtn',type:'button'},'Weiterspielen');b.onclick=()=>login(p.name);r.append(b);bd.append(r)})}
}
function login(name){
  const key=Object.keys(DB.players).find(k=>k.toLowerCase()===name.toLowerCase());
  if(key)P=DB.players[key];else{P={name,res:{}};DB.players[name]=P}
  DB.last=P.name;save();showHub();
}

/* ---------- Übersicht ---------- */
function showHub(){
  runCleanup();setTheme(0);topbar();window.scrollTo(0,0);
  const done=Object.keys(P.res).length;
  app.innerHTML=`<div class="hubhead"><div><div class="eyebrow">Übersicht</div><h2>Hallo, <em>${esc(P.name)}.</em></h2></div>
    <div class="totals"><b>${score(P)}</b>von ${TOTAL*100} Punkten · ${solvedOf(P)} gelöst</div></div>
    <div class="worlds" id="worlds"></div>
    ${done===TOTAL?'<div style="text-align:center;margin-top:30px"><button class="primary" id="fin">Zur Gesamtauswertung →</button></div>':''}
    <div class="foot"><button id="rs">Meinen Spielstand zurücksetzen</button></div>`;
  const g=$('#worlds');
  WORLDS.forEach((W,w)=>{const n=worldCount(w),open=worldOpen(w);
    const c=h('button',{class:'world',type:'button',style:`background:${W.c};color:${W.fg}`},
      `${open?'':'<span class="lock">🔒</span>'}<span class="num">LEVEL 0${w+1}</span><span class="gl">${W.gl}</span><span class="tt">${W.name}</span><span class="ds">${W.ds}</span>
      <span class="bar"><i style="width:${n/W.lv.length*100}%"></i></span><span class="meta"><span>${n} / ${W.lv.length}</span><span>${worldScore(w)} P.</span></span>`);
    c.disabled=!open;if(!open)c.title='Schließe zuerst das vorherige Level ab.';
    c.onclick=()=>{const f=firstOpen(w);f===-1?showWorldEnd(w):showLevel(w,f)};g.append(c)});
  const fin=$('#fin');if(fin)fin.onclick=showFinal;
  const rs=$('#rs');let armed=false;rs.onclick=()=>{if(!armed){armed=true;rs.textContent='Wirklich alles löschen? Nochmal klicken.';return}P.res={};save();showHub()};
}

/* ---------- Rätselansicht ---------- */
function showLevel(w,i){
  runCleanup();setTheme(w);topbar();cur={w,i};hintsUsed=0;wrongs=0;solvedNow=false;
  const W=WORLDS[w],L=W.lv[i];
  app.innerHTML='';
  const head=h('div',{class:'lvhead'});const back=h('button',{class:'back',type:'button'},'← Übersicht');back.onclick=showHub;
  head.append(back,h('div',{class:'lvtitle'},`<span class="chip">Level 0${w+1} · ${W.name}</span><span class="pts" style="font-family:var(--mono);font-size:.85rem;color:var(--muted)">${worldScore(w)} / ${W.lv.length*100} P.</span>`));
  app.append(head);
  const map=h('nav',{class:'map'});
  W.lv.forEach((_,k)=>{const r=R(w,k);const d=h('button',{class:'dot'+(r?' '+r.status:'')+(k===i?' cur':''),type:'button',title:`Rätsel ${k+1}`},String(k+1));d.disabled=!accessible(w,k);d.onclick=()=>showLevel(w,k);map.append(d)});
  app.append(map);
  const card=h('section',{class:'card'});app.append(card);
  card.append(h('div',{class:'tag'},`<b>Rätsel ${i+1}</b> / ${W.lv.length} · ${TOUCH?L.tag.replace(' · Mac',''):L.tag}`),h('h2',{},L.t));
  if(pf(L,'q'))card.append(h('p',{class:'q'},pf(L,'q')));
  const box=h('div',{class:'box'});card.append(box);
  const msg=h('div',{class:'msg'});card.append(msg);
  const hintBox=h('div',{class:'hints'});card.append(hintBox);
  const api={solve:()=>solve(w,i),
    wrong:m=>{wrongs++;msg.className='msg';msg.textContent=m||pick(['Nicht ganz.','Leider nein. Dreh den Gedanken noch einmal um.','Falsch, aber vielleicht ist die Richtung schon richtig.','Nein. Denk um die Ecke.']);card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake')},
    say:(m,cls)=>{msg.className='msg '+(cls||'');msg.textContent=m}};
  const r=L.render(box,api);if(typeof r==='function')cleanup=r;
  const tools=h('div',{class:'tools'}),left=h('div',{class:'l'});
  const hb=h('button',{class:'hint',type:'button'},'💡 Tipp (−25)');
  const HS=pf(L,'hints');hb.onclick=()=>{if(hintsUsed>=HS.length)return;hintBox.append(h('p',{},`<b>Tipp ${hintsUsed+1}:</b> ${HS[hintsUsed]}`));hintsUsed++;if(hintsUsed>=HS.length)hb.remove();hb.blur()};
  left.append(hb);
  const pr=R(w,i);
  if(!pr||pr.status!=='done'){const sk=h('button',{class:'hint',type:'button'},'Überspringen');let armed=false;
    sk.onclick=()=>{if(!armed){armed=true;sk.textContent='Wirklich? Lösung ansehen (0 Punkte)';return}skip(w,i)};left.append(sk)}
  tools.append(left);
  if(pr)tools.append(h('span',{class:'lbl'},pr.status==='done'?`✓ bereits gelöst (${pr.pts} P.)`:'übersprungen'));
  card.append(tools);
}
function nextIdx(w,i){const n=WORLDS[w].lv.length;for(let k=i+1;k<n;k++)if(!R(w,k))return k;return firstOpen(w)}
function finishPanel(w,i,html,cls){
  const card=app.querySelector('.card');
  card.querySelectorAll('.box input,.box button,.tools button').forEach(x=>x.disabled=true);
  const t=card.querySelector('.tools');if(t)t.remove();card.querySelector('.msg').textContent='';
  const p=h('div',{class:'solved '+(cls||'')},html);card.append(p);
  const n=nextIdx(w,i);const nx=h('div',{class:'next'});
  const b=h('button',{class:'primary',type:'button'},n===-1?'Level abschließen →':`Weiter zu Rätsel ${n+1} →`);
  b.onclick=()=>n===-1?showWorldEnd(w):showLevel(w,n);nx.append(b);card.append(nx);
  setTimeout(()=>b.focus(),50);p.scrollIntoView({behavior:'smooth',block:'nearest'});
  // Karte aktualisieren
  const dots=app.querySelectorAll('.map .dot');const r=R(w,i);if(dots[i]&&r){dots[i].classList.add(r.status)}
  dots.forEach((d,k)=>d.disabled=!accessible(w,k));
  const pts=app.querySelector('.lvtitle .pts');if(pts)pts.textContent=`${worldScore(w)} / ${WORLDS[w].lv.length*100} P.`;
  topbar();
}
function solve(w,i){
  if(solvedNow)return;solvedNow=true;runCleanup();
  const L=WORLDS[w].lv[i],pts=Math.max(10,100-25*hintsUsed-5*wrongs);
  const pr=R(w,i);const best=pr&&pr.status==='done'?Math.max(pr.pts,pts):pts;
  P.res[w+'-'+i]={status:'done',pts:best};save();
  finishPanel(w,i,`<div class="check">✓</div><div><b>Gelöst!</b> +${pts} Punkte${hintsUsed?` <span style="color:var(--muted)">(${hintsUsed} Tipp${hintsUsed>1?'s':''})</span>`:''}<p>${pf(L,'expl')}</p></div>`);
}
function skip(w,i){
  if(solvedNow)return;solvedNow=true;runCleanup();
  const L=WORLDS[w].lv[i];P.res[w+'-'+i]={status:'skipped',pts:0};save();
  finishPanel(w,i,`<div class="check">→</div><div><b>Übersprungen.</b> Lösung: ${pf(L,'sol')}<p>${pf(L,'expl')}</p></div>`,'skip');
}
function rankFor(pct){return pct>=.87?'Meisterin oder Meister der Seitenwege':pct>=.67?'Ausgezeichnet um die Ecke gedacht':pct>=.45?'Auf gutem Umweg':pct>=.2?'Die Ecken werden sichtbar':'Geradeausdenker, aber nicht mehr lange'}
function showWorldEnd(w){
  runCleanup();setTheme(w);topbar();window.scrollTo(0,0);
  const W=WORLDS[w],sc=worldScore(w),max=W.lv.length*100;
  let solvedN=0;for(let i=0;i<W.lv.length;i++){const r=R(w,i);if(r&&r.status==='done')solvedN++}
  app.innerHTML='';const back=h('button',{class:'back',type:'button'},'← Übersicht');back.onclick=showHub;{const d=h('div',{class:'lvhead'});d.append(back);app.append(d)}
  const card=h('section',{class:'card end'},`<span class="chip">Level 0${w+1} · ${W.name} geschafft</span><div class="score">${sc}<span style="font-size:1.3rem;color:var(--muted)"> / ${max}</span></div><div class="rank">${rankFor(sc/max)}</div><p class="q" style="margin:0 auto 22px">${solvedN} von ${W.lv.length} Rätseln selbst gelöst. Über die Punkte im Level kannst du jedes Rätsel noch einmal spielen.</p>`);
  const a=h('div',{class:'acts',style:'justify-content:center'});
  const re=h('button',{class:'ghostbtn',type:'button'},'Level ansehen');re.onclick=()=>showLevel(w,0);a.append(re);
  if(w<WORLDS.length-1){const nx=h('button',{class:'primary',type:'button'},`Weiter zu Level 0${w+2} →`);nx.onclick=()=>{const f=firstOpen(w+1);f===-1?showWorldEnd(w+1):showLevel(w+1,f)};a.append(nx)}
  else{const nx=h('button',{class:'primary',type:'button'},'Zur Gesamtauswertung →');nx.onclick=showFinal;a.append(nx)}
  card.append(a);app.append(card);
}
function showFinal(){
  runCleanup();setTheme(4);topbar();window.scrollTo(0,0);
  const sc=score(P),max=TOTAL*100;
  app.innerHTML=`<div class="end"><div class="eyebrow">Gesamtauswertung</div><h1 class="hero" style="margin-top:14px">${esc(P.name)},<br><em>geschafft.</em></h1>
    <div class="score">${sc}<span style="font-size:1.4rem;color:var(--muted)"> / ${max}</span></div><div class="rank">${rankFor(sc/max)}</div>
    <p class="lead" style="margin:0 auto 26px">${solvedOf(P)} von ${TOTAL} Rätseln selbst gelöst.</p></div>`;
  const specs=h('div',{class:'specimens',style:'grid-template-columns:repeat(5,1fr)'});
  WORLDS.forEach((W,w)=>specs.append(h('div',{class:'spec',style:`background:${W.c};color:${W.fg};aspect-ratio:1`},`<small>${W.name}</small><b style="font-family:var(--mono);font-size:1.8rem">${worldScore(w)}</b>`)));
  app.append(specs);
  const a=h('div',{class:'acts',style:'justify-content:center'});const b1=h('button',{class:'primary',type:'button'},'Zur Bestenliste');b1.onclick=showStart;const b2=h('button',{class:'ghostbtn',type:'button'},'Übersicht');b2.onclick=showHub;a.append(b2,b1);app.append(a);
}

showStart();
})();
</script>
</body>
</html>
