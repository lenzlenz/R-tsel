<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elisas Rätsel Eck</title>
<!-- Für Neugierige, die unter die Oberfläche schauen: Das Lösungswort von Level 5, Rätsel 13 lautet FUNDAMENT. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111111;--muted:#77756f;--line:#e8e6e1;--soft:#f6f5f2;--paper:#ffffff;
  --red:#E5432D;--orange:#F08A24;--yellow:#F6C62E;--green:#2E9E62;--sky:#3AA6DD;--steel:#5E6E82;
  --c:var(--red);--cfg:#fff;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;touch-action:manipulation}
*{-webkit-tap-highlight-color:transparent}
.hoverword,.rclick,.lock{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.exit{background:#1f8a4c;color:#fff;border:0;border-radius:6px;padding:6px 10px;font-size:.9rem;cursor:pointer}
.symgrid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.sym{width:68px;height:68px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:2rem;cursor:pointer;color:var(--ink)}
.fundament{margin-top:140vh;padding:20px 0 30px;text-align:center;font:.8rem var(--mono);color:#e4e2dd}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--serif);font-size:1.6rem;cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}
.brand i{color:var(--red)}
.who{display:flex;gap:18px;align-items:center;font-size:.9rem}
.who .pts{font-family:var(--mono);font-weight:600}
.who a{color:var(--muted);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.app{max-width:1080px;margin:0 auto;padding:40px 24px 90px}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1.hero{font-family:var(--serif);font-weight:400;font-size:clamp(3rem,8vw,6.4rem);line-height:.95;letter-spacing:-.02em;margin:18px 0 18px}
h1.hero em{color:var(--red)}
.lead{font-size:1.2rem;line-height:1.5;color:#3b3a37;max-width:560px}
.specimens{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:34px 0 40px}
.spec{aspect-ratio:3/4;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between;padding:14px;color:#fff;transition:transform .25s}
.spec:hover{transform:translateY(-6px) rotate(-1deg)}
.spec small{font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;opacity:.85}
.spec b{font-size:clamp(2rem,5vw,3.6rem);line-height:1;font-weight:400}
.namebox{display:flex;gap:10px;max-width:520px;margin-top:8px}
input{flex:1;min-width:0;font:500 1.1rem var(--sans);padding:14px 18px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink)}
input:focus{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
input.up{text-transform:uppercase;font-family:var(--mono);letter-spacing:.04em}
.primary{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:14px 26px;font-size:1rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s}
.primary:hover:not(:disabled){background:var(--c)}
.primary:disabled,.ghostbtn:disabled,.opt:disabled{opacity:.35;cursor:not-allowed}
.ghostbtn{background:#fff;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px;padding:11px 20px;font-size:.95rem;font-weight:600;cursor:pointer}
.ghostbtn:hover:not(:disabled){background:var(--soft)}
.board{margin-top:46px;border-top:1px solid var(--line)}
.board h3{font-family:var(--serif);font-weight:400;font-size:2rem;margin:26px 0 10px}
.brow{display:grid;grid-template-columns:40px 1fr 120px 120px 110px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:1rem}
.brow .n{font-family:var(--mono);color:var(--muted)}
.brow .s{font-family:var(--mono);font-weight:600;text-align:right}
.brow .c{font-family:var(--mono);color:var(--muted);text-align:right;font-size:.85rem}
.brow button{justify-self:end;padding:8px 16px;font-size:.85rem}
/* hub */
.hubhead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hubhead h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,6vw,4.4rem);margin:10px 0 0;line-height:1}
.hubhead h2 em{color:var(--red)}
.totals{font-family:var(--mono);text-align:right;font-size:.85rem;color:var(--muted)}
.totals b{display:block;font-size:2.2rem;color:var(--ink)}
.worlds{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:34px}
.world{border:0;border-radius:22px;padding:18px 18px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;min-height:330px;transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden}
.world:hover:not(:disabled){transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.12)}
.world:disabled{cursor:not-allowed;filter:grayscale(1);opacity:.35}
.world .num{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em}
.world .gl{font-family:var(--serif);font-size:5.6rem;line-height:1;margin:auto 0 8px}
.world .tt{font-size:1.25rem;font-weight:700}
.world .ds{font-size:.85rem;line-height:1.4;opacity:.85;margin-top:4px}
.world .bar{height:5px;border-radius:3px;background:rgba(0,0,0,.15);margin-top:14px;overflow:hidden}
.world .bar i{display:block;height:100%;background:currentColor}
.world .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.72rem;margin-top:8px}
.world .lock{position:absolute;top:16px;right:16px;font-size:1rem}
/* level */
.lvhead{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.back{background:none;border:0;cursor:pointer;font-size:.95rem;color:var(--muted);padding:0}
.back:hover{color:var(--ink)}
.lvtitle{display:flex;align-items:center;gap:14px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:var(--cfg);border-radius:999px;padding:6px 14px;font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.map{display:grid;grid-template-columns:repeat(15,1fr);gap:6px;margin-bottom:22px}
.dot{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--muted);font:600 .78rem var(--mono);cursor:pointer;padding:0;transition:.15s}
.dot:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.dot.done{background:var(--c);border-color:var(--c);color:var(--cfg)}
.dot.skipped{background:#cfcdc7;border-color:#cfcdc7;color:#fff}
.dot.cur{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink);color:var(--ink)}
.dot.cur.done{color:var(--cfg)}
.dot:disabled{cursor:not-allowed;opacity:.3}
.card{border:1px solid var(--line);border-radius:26px;padding:38px 42px 26px;position:relative;background:#fff}
.card.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.card .tag{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card .tag b{color:var(--ink)}
.card h2{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.02;margin:8px 0 18px;letter-spacing:-.01em}
.q{font-size:1.18rem;line-height:1.6;margin:0 0 6px;max-width:720px}
.big{font:500 1.75rem var(--mono);letter-spacing:.08em;text-align:center;margin:22px 0;padding:26px 16px;background:var(--soft);border-radius:18px;word-break:break-word;line-height:1.5}
.big small{display:block;font:400 .95rem var(--sans);letter-spacing:0;color:var(--muted);margin:6px 0}
.row{display:flex;gap:10px;margin-top:20px;max-width:620px}
.msg{min-height:1.6em;margin-top:16px;font-weight:500;color:var(--red)}
.msg.info{color:var(--muted);font-weight:400}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.tools .l{display:flex;gap:8px;flex-wrap:wrap}
.hint{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:.86rem;cursor:pointer;color:var(--muted)}
.hint:hover{border-color:var(--ink);color:var(--ink)}
.small-lbl,.lbl{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hints p{margin:12px 0 0;padding:12px 16px;background:color-mix(in srgb,var(--c) 12%,#fff);border-radius:12px;font-size:.98rem;line-height:1.5}
.solved{display:flex;gap:18px;align-items:flex-start;background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:18px;padding:20px 22px;margin-top:18px}
.solved.skip{background:var(--soft)}
.check{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);color:var(--cfg);display:grid;place-items:center;font-size:1.3rem;font-weight:700}
.skip .check{background:#9a988f;color:#fff}
.solved p{margin:6px 0 0;line-height:1.55}
.next{margin-top:16px;text-align:right}
.mc{display:flex;flex-direction:column;gap:9px;margin-top:16px;max-width:760px}
.opt{text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 18px;font-size:1.02rem;cursor:pointer;color:var(--ink);line-height:1.45;transition:border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.small{padding:10px 18px;text-align:center}
.steps{display:flex;gap:6px;margin:6px 0 4px}
.steps span{width:32px;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--c)}.steps span.now{background:var(--ink)}
.arena{position:relative;height:280px;border-radius:18px;margin-top:16px;overflow:hidden;background:var(--soft)}
.flee{position:absolute;padding:13px 24px;border-radius:999px;border:0;background:var(--c);color:var(--cfg);font-size:1rem;font-weight:700;cursor:pointer;transition:left .18s,top .18s;white-space:nowrap}
.flee:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.dark{background:#0b0b0c;color:#2b2b30;border-radius:18px;padding:46px 24px;margin-top:16px;text-align:center;font-size:1.05rem;line-height:2}
.dark .ghost{color:#0b0b0c}
.dark ::selection{background:#fff;color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.grid div{font:500 1.2rem var(--mono);background:var(--soft);border-radius:12px;padding:14px;text-align:center;letter-spacing:.06em}
.grid div.ask{background:var(--ink);color:#fff;grid-column:1/-1}
.bridge{display:flex;align-items:center;gap:12px;margin:10px 0;font:500 1.15rem var(--mono);flex-wrap:wrap}
.bridge span{min-width:120px}
.bridge span:first-child{text-align:right}
.bridge input{flex:0 1 220px;padding:10px 16px;font-size:1.05rem}
.bridge input.good{border-color:var(--green);background:#eef8f1}
.wide .bridge span:first-child{min-width:330px}
.lcd{font:600 2.8rem var(--mono);background:#a8b597;color:#1d2a1a;border-radius:12px;padding:16px 22px;text-align:right;letter-spacing:.1em;box-shadow:inset 0 3px 8px rgba(0,0,0,.25);max-width:340px;margin:18px auto 6px}
.calc-note{text-align:center;color:var(--muted)}
.panel{background:var(--soft);border-radius:18px;padding:20px;margin-top:16px}
.switches{display:flex;gap:14px;margin:14px 0;justify-content:center;flex-wrap:wrap}
.sw{width:104px;padding:14px 6px;border-radius:16px;border:1.5px solid var(--ink);background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink)}
.sw .knob{width:24px;height:42px;border-radius:8px;background:#e7e5df;position:relative;border:1.5px solid var(--ink)}
.sw .knob::after{content:"";position:absolute;left:2px;right:2px;height:17px;border-radius:5px;background:var(--ink);bottom:2px;transition:.15s}
.sw.on .knob::after{bottom:19px;background:var(--c)}
.sw:disabled{opacity:.5;cursor:not-allowed}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.room{display:flex;align-items:center;gap:20px;background:#17171a;color:#bbb;border-radius:18px;padding:20px;margin-top:16px}
.room p{margin:0}.room b{color:#fff}
.bulb{flex:none;width:46px;height:46px;border-radius:50%;background:#333;border:2px solid #555}
.room.lit .bulb{background:#ffd866;box-shadow:0 0 30px 10px rgba(255,216,102,.55);border-color:#ffe9a8}
.redwrap{display:grid;place-items:center;padding:34px 0 10px}
.red{width:180px;height:180px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff7a62,#E5432D 55%,#8a2414);color:#fff;font:700 1.4rem var(--mono);letter-spacing:.1em;cursor:pointer;box-shadow:0 10px 0 #5a190e,0 16px 30px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.red:active{transform:translateY(8px);box-shadow:0 2px 0 #5a190e,0 6px 12px rgba(0,0,0,.2)}
.doors{display:flex;gap:14px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.door{width:110px;height:170px;border-radius:12px 12px 4px 4px;border:2px solid var(--ink);background:#fff;cursor:pointer;font-family:var(--mono);font-size:.8rem;position:relative}
.door::after{content:"";position:absolute;right:14px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.hoverword{display:inline-block;margin:26px auto 0;padding:22px 40px;border-radius:18px;background:var(--soft);font-family:var(--serif);font-size:2.6rem;cursor:default;position:relative}
.tip{position:absolute;left:50%;top:100%;transform:translate(-50%,8px);background:var(--ink);color:#fff;font:500 .85rem var(--mono);padding:6px 12px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none}
.tip.show{opacity:1}
.clock{font:600 3.4rem var(--mono);text-align:center;margin:22px 0 10px;letter-spacing:.06em}
.mirror{transform:scaleX(-1);display:block}
.copyme{font-family:var(--serif);font-size:2rem;text-align:center;padding:30px 20px;background:var(--soft);border-radius:18px;margin-top:16px;line-height:1.3}
.squeeze{margin:18px auto 0;width:42px;height:220px;background:var(--soft);border-radius:12px;display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;writing-mode:vertical-rl;color:var(--muted);transition:width .3s}
.cmdzone{display:grid;place-items:center;padding:30px;font-family:var(--serif);font-size:6rem;color:var(--line)}
.tiny{font-size:2px;line-height:1;color:#9b9890;text-align:center;padding:40px 0;background:var(--soft);border-radius:18px;margin-top:16px}
.rclick{margin-top:16px;padding:60px 20px;border-radius:18px;background:var(--soft);text-align:center;font-family:var(--serif);font-size:2rem;cursor:pointer;user-select:none}
.scroller{height:240px;overflow-y:auto;border-radius:18px;background:var(--soft);margin-top:16px;padding:0 24px;text-align:center}
.scroller p{margin:0;padding:110px 0;font-family:var(--mono);color:#b4b1a9}
.scroller .deep{color:var(--ink);font-size:1.3rem;padding:60px 0 100px}
.lock{display:grid;place-items:center;margin:26px 0 6px;font-size:5rem;transition:transform .2s}
.lock.wiggle{animation:shake .4s}
.holdbar{height:6px;max-width:260px;margin:8px auto 0;border-radius:3px;background:var(--line);overflow:hidden}
.holdbar i{display:block;height:100%;width:0;background:var(--c)}
.banks{display:grid;grid-template-columns:1fr 150px 1fr;gap:12px;align-items:stretch;margin-top:16px}
.bank{background:var(--soft);border-radius:18px;padding:14px;min-height:190px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent}
.bank.torch{border-color:var(--c)}
.mid{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.mid .time{font:600 1.6rem var(--mono)}
.token{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:1rem;text-align:left;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.token small{font-family:var(--mono);color:var(--muted)}
.token.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 15%,#fff)}
.token:disabled{cursor:default;opacity:.6}
.jugs{display:flex;gap:40px;justify-content:center;align-items:flex-end;margin:22px 0 6px}
.jug{text-align:center}
.jug .glass{width:90px;border:2.5px solid var(--ink);border-top:0;border-radius:0 0 14px 14px;position:relative;overflow:hidden;background:#fff}
.jug .water{position:absolute;left:0;right:0;bottom:0;background:var(--sky);transition:height .35s}
.jug .lvl{font:600 1.4rem var(--mono);margin-top:8px}
.jug .ticks{position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 calc(var(--u) - 1px),rgba(0,0,0,.15) calc(var(--u) - 1px) var(--u))}
.end{text-align:center;padding:10px 0}
.end .score{font:600 4rem var(--mono);margin:10px 0 0}
.end .rank{font-family:var(--serif);font-size:2.2rem;font-style:italic;color:var(--c);margin:6px 0 18px}
.foot{margin-top:30px;text-align:center}
.foot button{background:none;border:0;color:var(--muted);font:.8rem var(--mono);cursor:pointer;text-decoration:underline}

.sec{display:flex;justify-content:space-between;align-items:baseline;margin:50px 0 0;border-top:1px solid var(--line);padding-top:22px;flex-wrap:wrap;gap:6px}
.sec h3{font-family:var(--serif);font-weight:400;font-size:2.3rem;margin:0}
.sec span{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
button.spec{border:0;text-align:left;cursor:pointer;font-family:inherit}
.spec b{display:block}
.spec .pm{font-family:var(--mono);font-size:.66rem;display:flex;justify-content:space-between;margin-top:6px;opacity:.9}
.spec .bar{display:block;height:4px;background:rgba(0,0,0,.15);border-radius:2px;overflow:hidden;margin-top:10px}
.spec .bar i{display:block;height:100%;background:currentColor}
.mapq{grid-template-columns:repeat(auto-fill,minmax(26px,30px));gap:4px;justify-content:start}.mapq .dot{font-size:.58rem}
.quizimg{padding:12px}
.opt.right,.opt.right:disabled{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,#fff);font-weight:600}
.opt.gone{text-decoration:line-through}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--c);border-color:var(--c);color:var(--cfg)}
.wswrap{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;margin-top:16px}
.ws{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;width:min(100%,500px)}
.ws button{aspect-ratio:1;border:0;border-radius:6px;background:var(--soft);font:600 clamp(.7rem,2.6vw,1rem) var(--mono);cursor:pointer;color:var(--ink);padding:0}
.ws button.sel{background:var(--ink);color:#fff}.ws button.hit{background:var(--c);color:var(--cfg)}
.wslist{display:flex;flex-wrap:wrap;gap:6px;max-width:300px;align-content:flex-start}
.wslist span{font:600 .8rem var(--mono);padding:5px 10px;border-radius:999px;background:var(--soft)}
.wslist span.got{text-decoration:line-through;opacity:.45}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px}
.mcard{aspect-ratio:1;border:0;border-radius:14px;cursor:pointer;position:relative;background:#1F3A5F;padding:0;overflow:hidden;transition:transform .25s}
.mcard .back{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;color:#F6C62E}
.mcard .front{position:absolute;inset:0;display:none;background:#fff;align-items:center;justify-content:center}
.mcard .front svg{width:96%;height:auto}
.mcard.up .front{display:flex}.mcard.up{transform:rotateY(0)}.mcard.done{box-shadow:0 0 0 3px #F6C62E inset}
.cwwrap{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px;align-items:flex-start}
.cw{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:min(100%,440px)}
.cwx{aspect-ratio:1}
.cwc{aspect-ratio:1;position:relative;background:#fff;border:1.5px solid var(--ink);border-radius:3px}
.cwc input{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:0;padding:0;text-align:center;font:600 16px var(--mono);text-transform:uppercase;background:transparent}
.cwc input:focus{background:color-mix(in srgb,var(--c) 18%,#fff);box-shadow:none;outline:none}
.cwn{position:absolute;top:1px;left:3px;font:600 .55rem var(--mono);color:var(--muted);pointer-events:none}
.cwc.ok{background:#e6f4ea}.cwc.bad{background:#fbe3df}
.cwclues{flex:1;min-width:240px;max-width:420px}
.cwscroll{max-width:100%;overflow-x:auto;padding-bottom:6px}
.cw.big{width:auto}
.cw.big .cwn{font-size:.5rem}
.cwclues h4{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin:0 0 6px}
.cwclues p{margin:0 0 8px;cursor:pointer;line-height:1.4}
.map25{grid-template-columns:repeat(auto-fill,minmax(32px,42px));justify-content:start}
.lvtitle .pts{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.stage{position:relative;height:190px;border-radius:18px;background:#fff6e0;margin-top:16px;overflow:hidden;display:grid;place-items:center;font-size:1.4rem}
.curtain{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#9e1b1b 0 18px,#b72727 18px 36px);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:.9rem;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.lights{display:grid;grid-template-columns:repeat(3,80px);gap:10px;justify-content:center;margin-top:20px}
.light{width:80px;height:80px;border-radius:16px;border:0;background:#2b2b30;cursor:pointer;transition:background .15s}
.light.on{background:#ffd866;box-shadow:0 0 24px rgba(255,216,102,.6)}
.hanoi{display:flex;gap:10px;justify-content:center;margin-top:20px}
.peg{flex:1;max-width:200px;height:180px;background:var(--soft);border:2px solid transparent;border-radius:14px;cursor:pointer;display:flex;flex-direction:column-reverse;align-items:center;padding:10px 4px;position:relative;gap:4px}
.peg.sel{border-color:var(--ink)}
.rod{position:absolute;bottom:10px;top:24px;width:6px;border-radius:3px;background:#cfcdc7;left:50%;transform:translateX(-50%)}
.disc{height:22px;border-radius:11px;position:relative;z-index:1;display:block}
.slide{display:grid;grid-template-columns:repeat(3,84px);gap:8px;justify-content:center;margin-top:20px}
.tile{width:84px;height:84px;border-radius:14px;border:0;background:var(--c);color:var(--cfg);font:600 1.8rem var(--mono);cursor:pointer}
.tile.empty{background:transparent;cursor:default}
.svgbox{display:grid;place-items:center;background:var(--soft);border-radius:18px;padding:20px;margin-top:16px}
.svgbox svg{max-width:100%;height:auto}
.closeup{height:260px;background:var(--soft);border-radius:18px;margin-top:16px;overflow:hidden;display:grid;place-items:center;touch-action:none}
.closeup span{font-size:22rem;line-height:1;display:block;transition:transform .1s}
.invis{position:absolute;width:70px;height:50px;border:0;background:transparent;cursor:pointer;border-radius:10px}
.invis:focus-visible{outline:3px solid var(--ink)}
.hscroll{display:flex;overflow-x:auto;overflow-y:hidden;border-radius:18px;background:var(--soft);margin-top:16px;height:160px;align-items:center}
.hscroll span{flex:none;width:380px;text-align:center;font-family:var(--mono);color:#b4b1a9}
.hscroll .deep{color:var(--ink);font-size:1.3rem}
.hay{font:.72rem/1.35 var(--mono);word-break:break-all;color:#a8a59c;background:var(--soft);border-radius:18px;padding:16px;margin-top:16px;max-height:260px;overflow:auto}
.drop{display:grid;place-items:center;height:200px;border:2px dashed var(--line);border-radius:18px;margin-top:16px;font-size:4rem;cursor:pointer;overflow:hidden}
.drop.over{border-color:var(--c)}
.drop img{max-height:100%;max-width:100%}
@media (max-width:900px){.worlds{grid-template-columns:repeat(2,1fr)}.specimens{grid-template-columns:repeat(3,1fr)}.brow{grid-template-columns:30px 1fr 90px 90px}.brow .c{display:none}.wide .bridge span:first-child{min-width:0;text-align:left}}
@media (max-width:600px){.lights{grid-template-columns:repeat(3,70px)}.light{width:70px;height:70px}.slide{grid-template-columns:repeat(3,72px)}.tile{width:72px;height:72px}.sec h3{font-size:1.8rem}.card{padding:26px 18px;border-radius:20px}.banks{grid-template-columns:1fr}.big{font-size:1.15rem;padding:20px 10px}
  .top .in{padding:10px 16px}.brand{font-size:1.25rem;white-space:nowrap}.who .pts{white-space:nowrap}.who a .long{display:none}.totals{text-align:left}.big{letter-spacing:.02em}.who{gap:10px;font-size:.8rem}.who span:first-child{max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .app{padding:24px 16px 80px}.specimens{gap:8px}.spec{padding:10px;border-radius:14px}
  .world{min-height:220px;padding:14px}.world .gl{font-size:3.6rem}.world .ds{display:none}
  .map{gap:3px}.dot{font-size:.62rem}.bridge{font-size:1rem;gap:8px}.bridge span{min-width:0}.bridge span:first-child{text-align:left}
  .row{flex-direction:column}.namebox{flex-direction:column}.brow{grid-template-columns:26px 1fr 70px;font-size:.9rem}.brow button{grid-column:1/-1;justify-self:stretch;margin-top:8px}
  .lcd{font-size:2rem}.clock{font-size:2.4rem}.jugs{gap:24px}.red{width:150px;height:150px}.door{width:70px;height:120px}
  h1.hero{font-size:3.2rem}.lead{font-size:1.05rem}.card h2{font-size:2.1rem}.q{font-size:1.05rem}}
input{font-size:16px}
@media (max-width:600px){.mapq{grid-template-columns:repeat(auto-fill,minmax(19px,1fr));gap:3px}.mapq .dot{font-size:.45rem;border-width:1px}.mapq .dot.cur{box-shadow:0 0 0 1px #fff,0 0 0 2px var(--ink)}}
</style>

<body>
<div class="top"><div class="in"><button class="brand" id="brand">Elisas Rätsel <i>Eck</i></button><div class="who" id="who"></div></div></div>
<main class="app" id="app"></main>

<script>
(function(){
/* ---------- Speicher ---------- */
const LS='umdieecke_v2';
let DB={players:{},last:null};
try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.players)DB=s}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){}}
let P=null; // aktueller Spieler
const BASE_TITLE=document.title;
let cleanup=null,hintsUsed=0,wrongs=0,solvedNow=false,cur={w:0,i:0};
const $=s=>document.querySelector(s);
const app=$('#app');
function h(t,a,html){const e=document.createElement(t);a=a||{};for(const k in a)e.setAttribute(k,a[k]);if(html!=null)e.innerHTML=html;return e}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toUpperCase().replace(/Ä/g,'AE').replace(/Ö/g,'OE').replace(/Ü/g,'UE').replace(/ß/g,'SS').replace(/[^A-Z0-9]/g,'');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TOUCH=window.matchMedia('(hover: none) and (pointer: coarse)').matches||('ontouchstart' in window&&navigator.maxTouchPoints>0&&!window.matchMedia('(hover: hover)').matches);
const pf=(L,k)=>TOUCH&&L[k+'T']!=null?L[k+'T']:L[k];
function longPress(el,ms,onDone,onShort){let t=null,done=false;
  const start=e=>{e.preventDefault();done=false;clearTimeout(t);t=setTimeout(()=>{done=true;onDone()},ms)};
  const end=()=>{if(t&&!done&&onShort)onShort();clearTimeout(t);t=null};
  el.addEventListener('touchstart',start,{passive:false});el.addEventListener('touchend',end);el.addEventListener('touchcancel',()=>{clearTimeout(t);t=null});
  return()=>clearTimeout(t)}

/* ---------- Bausteine ---------- */
function textQuiz(b,api,answers,opt){
  opt=opt||{};
  const f=h('form',{class:'row'});
  const inp=h('input',{class:'up',placeholder:opt.ph||'Deine Antwort',autocomplete:'off',spellcheck:'false'});
  const bt=h('button',{class:'primary',type:'submit'},'Prüfen');
  f.append(inp,bt);b.append(f);
  f.addEventListener('submit',e=>{e.preventDefault();if(!inp.value.trim())return;const v=norm(inp.value);
    const list=(typeof answers==='function'?answers():answers).map(norm);
    if(list.includes(v))api.solve();else{api.wrong(opt.wm&&opt.wm(v));inp.select()}});
  if(!opt.noFocus)setTimeout(()=>inp.focus(),60);
}
function mc(b,api,q,opts,onOk){
  const wrap=h('div',{class:'mc'});
  if(q)wrap.append(h('p',{class:'q'},q));
  shuffle(opts.slice()).forEach(o=>{const bt=h('button',{class:'opt',type:'button'},o.t);
    bt.onclick=()=>{if(o.ok){bt.classList.add('right');onOk()}else{api.wrong(o.why);bt.disabled=true}};wrap.append(bt)});
  b.append(wrap);
}
function multi(b,api,rows,wide){
  const f=h('form',{class:wide?'wide':''});const ins=[];
  rows.forEach(r=>{const row=h('div',{class:'bridge'});const i=h('input',{class:'up',autocomplete:'off',spellcheck:'false',placeholder:'?'});ins.push(i);
    row.append(h('span',{},r.l),i);if(r.r!=null)row.append(h('span',{},r.r));f.append(row)});
  f.append(h('button',{class:'primary',type:'submit',style:'margin-top:12px'},'Prüfen'));b.append(f);
  f.addEventListener('submit',e=>{e.preventDefault();let all=true;
    rows.forEach((r,k)=>{const ok=r.a.map(norm).includes(norm(ins[k].value));ins[k].classList.toggle('good',ok);if(!ok)all=false});
    if(all)api.solve();else api.wrong('Noch nicht alles stimmt. Die grünen Felder sind richtig.')});
  setTimeout(()=>ins[0].focus(),60);
}
// Kurzformen für Rätseltypen
const T=o=>Object.assign({},o,{render(b,api){if(o.big)b.append(h('div',{class:'big'},o.big));if(o.grid){const g=h('div',{class:'grid'});o.grid.forEach(x=>g.append(h('div',{},x)));g.append(h('div',{class:'ask'},o.ask));b.append(g)}textQuiz(b,api,o.a,o)}});
const M=o=>Object.assign({},o,{render(b,api){if(o.big)b.append(h('div',{class:'big'},o.big));mc(b,api,'',o.o,()=>api.solve())}});
function onDoc(type,fn,opts){document.addEventListener(type,fn,opts);return()=>document.removeEventListener(type,fn,opts)}
function onWin(type,fn){window.addEventListener(type,fn);return()=>window.removeEventListener(type,fn)}

/* =========================================================
   LEVEL 1 – AUFWÄRMEN
   ========================================================= */
const W1=[
{ t:'Der scheue Knopf', tag:'Interaktion',
  q:'Drück den Knopf. Mehr ist es nicht.',
  hints:['Die Maus ist nicht das einzige Werkzeug, mit dem man einen Knopf drücken kann.','Drück die Tab-Taste, bis der Knopf markiert ist, und dann Enter.'],
  sol:'Den Knopf mit der Tastatur auslösen (Tab + Enter).',
  expl:'Der Knopf flieht vor dem Mauszeiger, aber nicht vor der Tastatur. Wer nur ans Klicken denkt, kommt hier nicht weiter.',
  hintsT:['Ein Finger ist für diesen Knopf zu wenig.','Tippe mit zwei Fingern gleichzeitig irgendwo in die graue Fläche.'],
  solT:'Mit zwei Fingern gleichzeitig in die Fläche tippen.',
  explT:'Der Knopf flieht vor jedem einzelnen Finger. Gegen zwei Finger auf einmal hat er keine Chance.',
  render(b,api){
    const ar=h('div',{class:'arena'}),btn=h('button',{class:'flee',type:'button'},'Drück mich');ar.append(btn);b.append(ar);
    const lines=['Huch!','Zu langsam.','Nö.','Fast!','Nicht so.','Vielleicht anders?','Ich bin schneller.'];let n=0;
    requestAnimationFrame(()=>{btn.style.left=(ar.clientWidth-btn.offsetWidth)/2+'px';btn.style.top=(ar.clientHeight-btn.offsetHeight)/2+'px'});
    function move(){btn.textContent=lines[n++%lines.length];const w=Math.max(0,ar.clientWidth-btn.offsetWidth-10),hh=Math.max(0,ar.clientHeight-btn.offsetHeight-10);
      btn.style.left=5+Math.random()*w+'px';btn.style.top=5+Math.random()*hh+'px'}
    btn.addEventListener('pointerenter',move);btn.addEventListener('pointerdown',e=>{e.preventDefault();move()});
    btn.addEventListener('click',e=>{if(e.detail===0&&!TOUCH)api.solve();else move()});
    ar.addEventListener('touchstart',e=>{if(e.touches.length>=2){e.preventDefault();api.solve()}},{passive:false});
  }},
T({ t:'Die Buchstabenfolge', tag:'Muster', q:'Welcher Buchstabe kommt als Nächstes?', big:'E · Z · D · V · F · S · S · A · ?', a:['N'], ph:'Ein Buchstabe',
  hints:['Es sind Anfangsbuchstaben von etwas, das du seit dem Kindergarten kannst.','Zähl einfach mal laut: Eins, Zwei, Drei …'], sol:'N',
  expl:'<b>E</b>ins, <b>Z</b>wei, <b>D</b>rei, <b>V</b>ier, <b>F</b>ünf, <b>S</b>echs, <b>S</b>ieben, <b>A</b>cht, also <b>N</b>eun.'}),
T({ t:'Katzen und Mäuse', tag:'Denkfalle', q:'3 Katzen fangen 3 Mäuse in 3 Minuten.<br>Wie viele Katzen braucht man, um 100 Mäuse in 100 Minuten zu fangen?', a:['3','DREI'], ph:'Anzahl',
  wm:v=>v==='100'?'Die naheliegende Antwort. Und genau deshalb falsch.':null,
  hints:['Wie lange braucht eine einzelne Katze für eine einzelne Maus?','Eine Katze schafft eine Maus in 3 Minuten, in 100 Minuten also gut 33.'], sol:'3',
  expl:'Jede Katze fängt alle 3 Minuten eine Maus, in 100 Minuten also gut 33. Drei Katzen schaffen damit 100 Mäuse.'}),
T({ t:'Was dir gehört', tag:'Rätsel', q:'Es gehört dir. Trotzdem benutzen es andere viel öfter als du. Was ist es?', a:['NAME','DEINNAME','MEINNAME','VORNAME'],
  hints:['Du hast es vorhin erst eingetippt.','Andere rufen dich damit.'], sol:'Dein Name',
  expl:'Dein <b>Name</b>. Du hast ihn ganz am Anfang eingetragen, aber benutzt wird er vor allem von anderen.'}),
{ t:'Der Kühlschrank', tag:'Kette · Transfer',
  q:'Vier Fragen, eine Geschichte. Jede Antwort baut auf der vorigen auf.',
  hints:['Vergiss nicht, was in den vorherigen Fragen passiert ist. Die Welt bleibt bestehen.','Was gerade im Kühlschrank steckt, kann nicht zur Party kommen.'],
  sol:'Tür auf, Elefant rein, Tür zu → Elefant raus, Giraffe rein → Die Giraffe fehlt → Einfach schwimmen.',
  expl:'Der Elefant muss erst raus, damit die Giraffe hineinpasst. Die Giraffe steckt deshalb im Kühlschrank und verpasst die Party. Und die Krokodile feiern gerade beim Löwen.',
  render(b,api){
    const st=[
      {q:'Wie bekommst du einen Elefanten in einen Kühlschrank?',o:[{t:'Tür auf, Elefant rein, Tür zu.',ok:1},{t:'Gar nicht, er ist zu groß.',why:'Zu realistisch gedacht. Hier gelten Rätselregeln.'},{t:'Man braucht einen größeren Kühlschrank.',why:'Niemand hat gesagt, dass er nicht passt.'},{t:'Man muss ihn vorher schrumpfen.',why:'Viel zu kompliziert.'}]},
      {q:'Gut. Und wie bekommst du jetzt eine Giraffe in den Kühlschrank?',o:[{t:'Tür auf, Giraffe rein, Tür zu.',why:'Da fehlt ein Schritt. Was ist denn gerade im Kühlschrank?'},{t:'Tür auf, Elefant raus, Giraffe rein, Tür zu.',ok:1},{t:'Gar nicht, eine Giraffe ist zu hoch.',why:'Der Elefant hat ja auch gepasst.'},{t:'Man legt sie quer hinein.',why:'Bequem, aber das ist nicht das Problem.'}]},
      {q:'Der Löwe feiert Geburtstag. Alle Tiere kommen, nur eines nicht. Welches?',o:[{t:'Die Giraffe',ok:1},{t:'Der Elefant',why:'Der wurde doch gerade aus dem Kühlschrank befreit.'},{t:'Die Antilope',why:'Klingt vernünftig, aber denk an die Geschichte.'},{t:'Die Maus',why:'Die Maus hat keinen Grund zu fehlen, ein anderes Tier aber schon.'}]},
      {q:'Letzte Frage: Du musst einen Fluss durchqueren, in dem sonst Krokodile leben. Es gibt keine Brücke und kein Boot. Was tust du?',o:[{t:'Einfach durchschwimmen.',ok:1},{t:'Warten, bis die Krokodile schlafen.',why:'Wo sind die Krokodile denn heute?'},{t:'Einen Umweg suchen.',why:'Es gibt keinen. Und wo sind heute eigentlich alle Tiere?'},{t:'Die Giraffe als Brücke benutzen.',why:'Die steckt noch im Kühlschrank.'}]}];
    let s=0;const hold=h('div');b.append(hold);
    (function step(){hold.innerHTML='';hold.append(h('div',{class:'steps'},st.map((_,k)=>`<span class="${k<s?'on':k===s?'now':''}"></span>`).join('')));
      mc(hold,api,st[s].q,st[s].o,()=>{s++;api.say('');if(s>=st.length)api.solve();else step()})})();
  }},
{ t:'Stromausfall', tag:'Meta',
  q:'Hier ist das Licht ausgefallen. Irgendwo in der Dunkelheit liegt das Lösungswort.',
  hints:['Licht ins Dunkel bringt man nicht nur mit einer Lampe.','Markiere den dunklen Bereich mit der Maus (oder ⌘ + A).'], hintsT:['Licht ins Dunkel bringt man nicht nur mit einer Lampe.','Drücke lange auf den dunklen Bereich und ziehe die Markierung über den Text.'], sol:'SCHATTEN',
  expl:'Der Text war schwarz auf schwarz. Erst wenn man ihn markiert, wird er sichtbar.',
  render(b,api){b.append(h('div',{class:'dark'},'Es ist zu dunkel, um hier etwas zu erkennen.<br><span class="ghost">Gut gemacht. Das Lösungswort lautet SCHATTEN.</span><br>Wirklich. Nichts zu sehen.'));textQuiz(b,api,['SCHATTEN'],{noFocus:true})}},
T({ t:'Die Herde', tag:'Genau lesen', q:'Ein Bauer hat 17 Schafe. Alle bis auf 9 sterben. Wie viele Schafe hat er noch?', a:['9','NEUN'], ph:'Anzahl',
  wm:v=>v==='8'?'Lies den Satz noch einmal ganz langsam.':null,
  hints:['Rechne nicht vorschnell.','„Alle bis auf 9“: Wer bleibt übrig?'], sol:'9',
  expl:'„Alle bis auf 9“ heißt: <b>9</b> überleben. Wer sofort 17 − 9 rechnet, tappt in die Falle.'}),
T({ t:'Der kurze Monat', tag:'Genau lesen', q:'Wie viele Monate eines Jahres haben 28 Tage?', a:['12','ZWOELF','ALLE','ALLE12'], ph:'Anzahl',
  wm:v=>v==='1'||v==='EINER'||v==='EINS'?'Der Februar hat 28 Tage. Aber nicht als Einziger.':null,
  hints:['Die Frage lautet nicht „genau 28 Tage“.','Hat der März etwa keine 28 Tage?'], sol:'Alle 12',
  expl:'<b>Alle zwölf</b> Monate haben mindestens 28 Tage. Nur der Februar hat nicht mehr.'}),
{ t:'Der verschlossene Raum', tag:'Meta · Mac',
  q:'Du bist in diesem Raum gefangen. Alle Türen sind verschlossen. Finde den Ausgang.',
  hints:['Den Notausgang findest du nicht auf dem Bildschirm.','Auf deiner Tastatur gibt es eine Taste, die genau so heißt: „Entkommen“.'], sol:'Die Escape-Taste drücken.',
  hintsT:['An den Türen zu rütteln bringt nichts. Jedes Gebäude hat einen ausgeschilderten Notausgang.','Suche das kleine grüne Schild.'], solT:'Auf das kleine grüne Notausgangsschild tippen.',
  explT:'Statt an den Türen zu rütteln, hättest du nur dem Notausgangsschild folgen müssen.',
  expl:'<i>Escape</i> heißt auf Deutsch „Flucht“. Der Ausgang war die ganze Zeit oben links auf deiner Tastatur.',
  render(b,api){
    const d=h('div',{class:'doors'});['Tür 1','Tür 2','Tür 3','Tür 4'].forEach(t=>{const x=h('button',{class:'door',type:'button'},t);x.onclick=()=>api.say(pick(['Verschlossen.','Rüttel, rüttel … nichts.','Auch zu.','Diese Tür ist nur gemalt.']),'info');d.append(x)});b.append(d);
    if(TOUCH){const ex=h('button',{class:'exit',type:'button',title:'Notausgang'},'🏃 →');ex.onclick=()=>api.solve();{const d=h('div',{style:'text-align:right;margin-top:14px'});d.append(ex);b.append(d)}}
    return onDoc('keydown',e=>{if(e.key==='Escape')api.solve()});
  }},
M({ t:'Der Mann im 10. Stock', tag:'Laterales Denken',
  q:'Ein Mann wohnt im 10. Stock. Morgens fährt er mit dem Aufzug ins Erdgeschoss. Abends fährt er nur bis in den 7. Stock und geht den Rest zu Fuß. Nur wenn es regnet, fährt er bis ganz nach oben. <b>Warum?</b>',
  hints:['Was hat er bei Regen dabei, was er sonst nicht hat?','Achte auf den Körper des Mannes, nicht auf das Gebäude.'],
  sol:'Er ist zu klein für die oberen Knöpfe, mit dem Regenschirm erreicht er sie.',
  expl:'Er reicht nur bis zum Knopf für den 7. Stock. Bei Regen hat er einen Schirm dabei und drückt damit die 10. Eine gute Erklärung deckt <i>alle</i> Angaben ab.',
  o:[{t:'Er ist zu klein, um die Knöpfe über der 7 zu erreichen. Mit dem Regenschirm kommt er an die 10.',ok:1},
    {t:'Er will abends noch etwas Sport machen.',why:'Und warum dann bei Regen nicht? Das Treppenhaus wird ja nicht nass.'},
    {t:'Abends fährt der Aufzug nur bis zum 7. Stock.',why:'Bei Regen fährt er aber durch. Der Aufzug weiß nichts vom Wetter.'},
    {t:'Im 7. Stock wohnt jemand, den er besucht.',why:'Das erklärt nicht, warum er bei Regen durchfährt.'}]}),
T({ t:'Wachsen durch Wegnehmen', tag:'Rätsel', q:'Je mehr du davon wegnimmst, desto größer wird es. Was ist es?', a:['LOCH','EINLOCH','DASLOCH','GRUBE'],
  hints:['Denk an eine Schaufel.','Es besteht eigentlich aus nichts.'], sol:'Ein Loch',
  expl:'Ein <b>Loch</b>: Jede Schaufel Erde, die man herausnimmt, macht es größer.'}),

  sol:'Schalter A 10 Minuten an, dann aus. Schalter B an. Rein: an = B, aus und warm = A, aus und kalt = C.',
  expl:'Eine Glühbirne verrät zwei Dinge: ob sie leuchtet und ob sie warm ist. Zusammen ergibt das drei unterscheidbare Zustände, genau einen für jeden Schalter.',
  render(b,api){

    function reset(){sw=[false,false,false];heat=[0,0,0];entered=false;mins=0;correct=Math.floor(Math.random()*3);draw()}

      ui.innerHTML='';const p=h('div',{class:'panel'});p.append(h('div',{class:'lbl'},`Im Flur · vergangene Zeit: ${mins} min`));

      const w=h('button',{class:'ghostbtn',type:'button'},'⏱ 10 Minuten warten');w.disabled=entered;w.onclick=()=>{mins+=10;sw.forEach((v,i)=>{if(v)heat[i]+=10});api.say('Zehn Minuten vergehen …','info');draw()};
      const en=h('button',{class:'primary',type:'button'},'🚪 Raum betreten (nur einmal)');en.disabled=entered;en.onclick=()=>{entered=true;api.say('');draw()};
      a.append(w,en);p.append(a);ui.append(p);
      if(entered){
        const lit=sw[correct],warm=heat[correct]>=10;
        ui.append(h('div',{class:'room'+(lit?' lit':'')},`<div class="bulb"></div><p>Die Glühbirne ist <b>${lit?'an':'aus'}</b>. Du fasst sie an: Sie ist <b>${warm?'warm':'kalt'}</b>.</p>`));

            api.wrong(i===correct?'Richtig geraten, aber mit deinen Beobachtungen hätte es auch ein anderer Schalter sein können. Raten zählt nicht.':`Leider nein, es war Schalter ${correct+1}.`+(amb?' Eindeutig bestimmen konntest du es mit diesem Versuch aber auch nicht.':''));
            const r=h('button',{class:'ghostbtn',type:'button'},'↻ Neuer Versuch (die Schalter werden neu verdrahtet)');r.onclick=()=>{api.say('');reset()};ch.innerHTML='';ch.append(r)};ch.append(bt)});

{ t:'Die Brücke bei Nacht', tag:'Logik · Simulation',
  q:'Vier Personen müssen nachts über eine wackelige Brücke. Es passen höchstens zwei gleichzeitig drauf, und sie haben nur eine Taschenlampe, die jedes Mal mit muss. Zu zweit geht man im Tempo des Langsameren. Die Lampe hält genau <b>17 Minuten</b>.',
  hints:['Die beiden Langsamsten sollten nicht getrennt gehen.','Ada und Ben gehen zuerst. Ada kommt zurück. Dann gehen Cleo und Dan gemeinsam …'], sol:'Ada+Ben (2), Ada zurück (1), Cleo+Dan (10), Ben zurück (2), Ada+Ben (2) = 17',
  expl:'Der Trick: Die beiden Langsamsten gehen <b>zusammen</b>, damit die 10 Minuten nur einmal zählen. 2 + 1 + 10 + 2 + 2 = 17.',
  render(b,api){
    const PP=[['Ada',1],['Ben',2],['Cleo',5],['Dan',10]];let side,torch,time,sel,dead;const ui=h('div');b.append(ui);
    function reset(){side=[0,0,0,0];torch=0;time=0;sel=[];dead=false;api.say('');draw()}
    function draw(){ui.innerHTML='';const banks=h('div',{class:'banks'});
      const mk=s=>{const bk=h('div',{class:'bank'+(torch===s?' torch':'')},`<div class="lbl">${s?'Ziel':'Start'}${torch===s?' · 🔦 Lampe':''}</div>`);
        PP.forEach((p,i)=>{if(side[i]!==s)return;const t=h('button',{class:'token'+(sel.includes(i)?' sel':''),type:'button'},`${p[0]} <small>${p[1]} min</small>`);t.disabled=dead||torch!==s;
          t.onclick=()=>{if(sel.includes(i))sel=sel.filter(x=>x!==i);else if(sel.length<2)sel.push(i);draw()};bk.append(t)});return bk};
      const mid=h('div',{class:'mid'},`<div class="lbl">Verbraucht</div><div class="time">${time} / 17</div>`);
      const go=h('button',{class:'primary',type:'button'},torch?'← zurück':'über →');go.disabled=dead||!sel.length;
      go.onclick=()=>{const t=Math.max(...sel.map(i=>PP[i][1]));time+=t;sel.forEach(i=>side[i]=1-torch);torch=1-torch;sel=[];
        if(time>17){dead=true;draw();api.wrong('Die Lampe ist aus. Ihr steht im Dunkeln.');const r=h('button',{class:'ghostbtn',type:'button'},'↻ Neu starten');r.onclick=reset;{const d=h('div',{class:'acts'});d.append(r);ui.append(d)}return}
        draw();if(side.every(x=>x===1))api.solve()};
      mid.append(go);banks.append(mk(0),mid,mk(1));ui.append(banks);
      const a=h('div',{class:'acts'});const r=h('button',{class:'ghostbtn',type:'button'},'↻ Neu starten');r.onclick=reset;a.append(h('span',{class:'lbl'},'Wähle eine oder zwei Personen auf der Seite der Lampe.'),r);ui.append(a)}
    reset();
  }},

{ t:'Wolf, Ziege, Kohl', tag:'Logik · Simulation',
  q:'Eine Bäuerin will Wolf, Ziege und Kohl über den Fluss bringen. Ins Boot passt außer ihr nur eines davon. Allein gelassen frisst der Wolf die Ziege, und die Ziege frisst den Kohl.',
  hints:['Die Ziege ist das Problem: Sie verträgt sich mit niemandem.','Man darf etwas auch wieder zurückbringen.'], sol:'Ziege rüber, zurück, Wolf rüber, Ziege zurück, Kohl rüber, zurück, Ziege rüber.',
  expl:'Der Schlüssel ist, die Ziege einmal <b>zurückzubringen</b>. Ein Rückschritt kann der Weg nach vorn sein.',
  render(b,api){
    const N=[['🧑‍🌾','Bäuerin'],['🐺','Wolf'],['🐐','Ziege'],['🥬','Kohl']];let pos,pas,dead,moves;const ui=h('div');b.append(ui);
    function reset(){pos=[0,0,0,0];pas=null;dead=false;moves=0;api.say('');draw()}
    function draw(){ui.innerHTML='';const banks=h('div',{class:'banks'});const f=pos[0];
      const mk=s=>{const bk=h('div',{class:'bank'+(f===s?' torch':'')},`<div class="lbl">${s?'Rechtes Ufer':'Linkes Ufer'}</div>`);
        N.forEach((n,i)=>{if(pos[i]!==s)return;const t=h('button',{class:'token'+(pas===i?' sel':''),type:'button'},`${n[0]} ${n[1]}${i===0?' <small>rudert</small>':''}`);
          t.disabled=dead||i===0||f!==s;t.onclick=()=>{pas=pas===i?null:i;draw()};bk.append(t)});return bk};
      const mid=h('div',{class:'mid'},`<div class="lbl">Fahrten</div><div class="time">${moves}</div>`);
      const go=h('button',{class:'primary',type:'button'},f?'← übersetzen':'übersetzen →');go.disabled=dead;
      go.onclick=()=>{pos[0]=1-f;if(pas!==null)pos[pas]=1-f;pas=null;moves++;const left=f;
        const alone=i=>pos[i]===left&&pos[0]!==left;
        let m=null;if(alone(1)&&alone(2))m='Der Wolf hat die Ziege gefressen.';else if(alone(2)&&alone(3))m='Die Ziege hat den Kohl gefressen.';
        if(m){dead=true;draw();api.wrong(m);return}
        draw();if(pos.every(x=>x===1))api.solve()};
      mid.append(go);banks.append(mk(0),mid,mk(1));ui.append(banks);
      const a=h('div',{class:'acts'});const r=h('button',{class:'ghostbtn',type:'button'},'↻ Neu starten');r.onclick=reset;a.append(h('span',{class:'lbl'},'Wähle, wer mitfährt (oder niemand), dann übersetzen.'),r);ui.append(a)}
    reset();
  }},

{ t:'Zwei Krüge', tag:'Logik · Simulation',
  q:'Du hast einen 5-Liter-Krug und einen 3-Liter-Krug, beide ohne Markierungen, und einen Wasserhahn. Miss <b>genau 4 Liter</b> im großen Krug ab.',
  hints:['Den kleinen Krug kannst du benutzen, um vom großen etwas „abzuziehen“.','Großen füllen, in den kleinen gießen (bleiben 2), kleinen leeren, die 2 hineingießen, großen füllen, kleinen auffüllen …'], sol:'5 füllen → in 3 gießen → 3 leeren → 2 umgießen → 5 füllen → 3 auffüllen = 4',
  expl:'Wenn du den großen Krug voll machst und den kleinen auffüllst, in dem schon 2 Liter sind, fließt genau 1 Liter ab. Im großen Krug bleiben <b>4 Liter</b>.',
  render(b,api){
    let A=0,B=0,n=0;const ui=h('div');b.append(ui);
    function jug(v,cap,lbl){const u=26;return `<div class="jug"><div class="glass" style="height:${cap*u}px;--u:${u}px"><div class="water" style="height:${v*u}px"></div><div class="ticks"></div></div><div class="lvl">${v} / ${cap} L</div><div class="lbl">${lbl}</div></div>`}
    function draw(){ui.innerHTML=`<div class="jugs">${jug(A,5,'Groß')}${jug(B,3,'Klein')}</div><p class="calc-note">Schritte: ${n}</p>`;
      const a=h('div',{class:'acts',style:'justify-content:center'});
      [['Groß füllen',()=>{A=5}],['Klein füllen',()=>{B=3}],['Groß leeren',()=>{A=0}],['Klein leeren',()=>{B=0}],['Groß → Klein',()=>{const m=Math.min(A,3-B);A-=m;B+=m}],['Klein → Groß',()=>{const m=Math.min(B,5-A);B-=m;A+=m}]]
        .forEach(([t,f])=>{const bt=h('button',{class:'ghostbtn',type:'button'},t);bt.onclick=()=>{f();n++;draw();if(A===4)api.solve()};a.append(bt)});
      const r=h('button',{class:'hint',type:'button'},'↻ Neu');r.onclick=()=>{A=0;B=0;n=0;draw()};a.append(r);ui.append(a)}
    draw();
  }},

{ t:'Das schwere Schloss', tag:'Meta',
  q:'Dieses Schloss öffnet nur der größte Schlüssel auf deiner Tastatur. Und er braucht Ausdauer.',
  hints:['Welche Taste ist auf deiner Tastatur mit Abstand die größte?','Halte die Leertaste gedrückt. Ein paar Sekunden lang.'], sol:'Die Leertaste 3 Sekunden gedrückt halten.',
  qT:'Dieses Schloss öffnet sich nicht durch Tippen. Es braucht Ausdauer.',
  hintsT:['Ein kurzes Tippen ist zu wenig.','Halte den Finger drei Sekunden lang auf dem Schloss.'], solT:'Den Finger 3 Sekunden auf dem Schloss halten.',
  explT:'„Ausdauer“ hieß: nicht tippen, sondern festhalten.',
  expl:'Der größte Schlüssel ist die <b>Leertaste</b>, und „Ausdauer“ hieß: gedrückt halten.',
  render(b,api){
    if(document.activeElement)document.activeElement.blur();
    const l=h('div',{class:'lock'},'🔒');const bar=h('div',{class:'holdbar'},'<i></i>');b.append(l,bar);let t0=0,raf;
    const fill=()=>{if(!t0)return;const p=Math.min(1,(Date.now()-t0)/3000);bar.firstChild.style.width=p*100+'%';if(p>=1){l.textContent='🔓';t0=0;api.solve()}else raf=requestAnimationFrame(fill)};
    const kd=onDoc('keydown',e=>{if(e.code!=='Space')return;e.preventDefault();if(!e.repeat&&!t0){t0=Date.now();fill()}},true);
    const ku=onDoc('keyup',e=>{if(e.code!=='Space')return;e.preventDefault();if(t0){t0=0;cancelAnimationFrame(raf);bar.firstChild.style.width='0';l.classList.remove('wiggle');void l.offsetWidth;l.classList.add('wiggle');api.say('Zu kurz. Das Schloss braucht mehr Ausdauer.','info')}},true);
    if(TOUCH){l.addEventListener('touchstart',e=>{e.preventDefault();if(!t0){t0=Date.now();fill()}},{passive:false});
      const stop=()=>{if(t0){t0=0;cancelAnimationFrame(raf);bar.firstChild.style.width='0';l.classList.remove('wiggle');void l.offsetWidth;l.classList.add('wiggle');api.say('Zu kurz. Das Schloss braucht mehr Ausdauer.','info')}};
      l.addEventListener('touchend',stop);l.addEventListener('touchcancel',stop)}
    return()=>{kd();ku();cancelAnimationFrame(raf)};
  }},

// Prüft freie Antworten mit eigener Regel: ok(v) liefert true oder eine Meldung
function vQuiz(b,api,ok,opt){
  opt=opt||{};
  const f=h('form',{class:'row'});
  const inp=h('input',{class:opt.raw?'':'up',placeholder:opt.ph||'Deine Antwort',autocomplete:'off',spellcheck:'false',autocapitalize:opt.raw?'none':'characters'});
  f.append(inp,h('button',{class:'primary',type:'submit'},'Prüfen'));b.append(f);
  f.addEventListener('submit',e=>{e.preventDefault();const raw=inp.value.trim();if(!raw)return;const r=ok(opt.raw?raw:norm(raw),raw);
    if(r===true)api.solve();else{api.wrong(typeof r==='string'?r:null);inp.select()}});
  if(!opt.noFocus&&!TOUCH)setTimeout(()=>inp.focus(),60);
  return inp;
}
function symPick(b,api,syms,right,msg){const g=h('div',{class:'symgrid'});shuffle(syms.slice()).forEach(s=>{const x=h('button',{class:'sym',type:'button'},s);x.onclick=()=>{if(s===right)api.solve();else{api.wrong(msg);x.disabled=true}};g.append(x)});b.append(g)}

T({t:'Zwei Kerzen',tag:'Logik',q:'Zwei gleich lange Kerzen: Die eine brennt in 4 Stunden ab, die andere in 3. Wann muss man beide gleichzeitig anzünden, damit um Mitternacht die eine genau doppelt so lang ist wie die andere?',a:['21:36'],ph:'hh:mm',

{t:'Lichter aus',tag:'Logik · Simulation',q:'Jeder Klick schaltet ein Licht und seine direkten Nachbarn (oben, unten, links, rechts) um. Mach alle Lichter aus.',
  hints:['Die Reihenfolge der Klicks ist egal. Jedes Feld muss höchstens einmal gedrückt werden.','Arbeite Zeile für Zeile: Ein Licht schaltest du aus, indem du auf das Feld direkt darunter klickst.'],sol:'Alle Lichter ausschalten.',
  expl:'Die Reihenfolge ist egal, und jedes Feld braucht man höchstens einmal. So lässt sich jedes lösbare Feld knacken.',
  render(b,api){let g,n;const ui=h('div');b.append(ui);
    const tog=(a,i)=>{const r=Math.floor(i/3),c=i%3;[[r,c],[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([y,x])=>{if(y>=0&&y<3&&x>=0&&x<3)a[y*3+x]^=1})};
    function reset(){do{g=Array(9).fill(0);shuffle([0,1,2,3,4,5,6,7,8]).slice(0,4).forEach(i=>tog(g,i))}while(g.every(x=>!x));n=0;draw()}
    function draw(){ui.innerHTML='';const grid=h('div',{class:'lights'});g.forEach((v,i)=>{const x=h('button',{class:'light'+(v?' on':''),type:'button'});x.onclick=()=>{tog(g,i);n++;draw();if(g.every(v=>!v))api.solve()};grid.append(x)});ui.append(grid);
      const a=h('div',{class:'acts',style:'justify-content:center'});a.append(h('span',{class:'lbl'},`Klicks: ${n}`));const r=h('button',{class:'hint',type:'button'},'↻ Neues Feld');r.onclick=reset;a.append(r);ui.append(a)}
    reset()}},
{t:'Der Turm',tag:'Logik · Simulation',q:'Versetze den ganzen Turm vom linken auf den rechten Stab. Klicke erst auf einen Stab und dann auf das Ziel. Du darfst immer nur die oberste Scheibe bewegen und nie eine größere auf eine kleinere legen.',
  hints:['Um die größte Scheibe zu bewegen, müssen alle anderen auf dem mittleren Stab liegen.','Die kleinste Scheibe wandert bei jedem zweiten Zug in dieselbe Richtung weiter: links → rechts → Mitte → links …'],sol:'Mindestens 15 Züge',
  expl:'Die Türme von Hanoi: Mit 4 Scheiben braucht man mindestens 15 Züge, allgemein 2ⁿ − 1.',
  render(b,api){let pegs,sel,n;const ui=h('div');b.append(ui);const cols=['var(--red)','var(--orange)','var(--yellow)','var(--green)'];
    function reset(){pegs=[[4,3,2,1],[],[]];sel=null;n=0;draw()}
    function draw(){ui.innerHTML='';const row=h('div',{class:'hanoi'});
      pegs.forEach((p,k)=>{const col=h('button',{class:'peg'+(sel===k?' sel':''),type:'button'});col.append(h('i',{class:'rod'}));p.forEach(d=>col.append(h('span',{class:'disc',style:`width:${26+d*20}%;background:${cols[d-1]}`})));
        col.onclick=()=>{if(sel===null){if(p.length)sel=k}else if(sel===k)sel=null;else{const from=pegs[sel],d=from[from.length-1];if(!p.length||p[p.length-1]>d){p.push(from.pop());n++;sel=null;if(pegs[2].length===4){draw();api.solve();return}}else{api.say('Größere Scheiben dürfen nicht auf kleinere.','info');sel=null}}draw()};row.append(col)});
      ui.append(row);const a=h('div',{class:'acts',style:'justify-content:center'});a.append(h('span',{class:'lbl'},`Züge: ${n} · Minimum: 15`));const r=h('button',{class:'hint',type:'button'},'↻ Neu');r.onclick=reset;a.append(r);ui.append(a)}
    reset()}},
M({t:'Zwei Zündschnüre',tag:'Logik',q:'Du hast zwei Zündschnüre. Jede brennt genau eine Stunde, aber ungleichmäßig: Die Hälfte der Schnur brennt nicht unbedingt in 30 Minuten. Wie misst du genau 45 Minuten ab?',
  hints:['Man kann eine Schnur auch an beiden Enden gleichzeitig anzünden.','An beiden Enden angezündet, brennt eine Schnur in genau 30 Minuten ab, egal wie ungleichmäßig.'],sol:'Schnur 1 beidseitig, Schnur 2 einseitig anzünden. Nach 30 min Schnur 2 am anderen Ende anzünden.',

{t:'Dreiecke zählen',tag:'Zählen',q:'Wie viele Dreiecke stecken in dieser Figur?',

{t:'Schiebepuzzle',tag:'Logik · Simulation',q:'Bring die Zahlen in die richtige Reihenfolge: 1 bis 8, das leere Feld unten rechts. Klicke auf ein Feld neben der Lücke, um es zu verschieben.',
  hints:['Löse zuerst die obere Reihe, dann die linke Spalte.','Für die letzten Felder: Lass die Steine im Kreis rotieren, bis sie passen.'],sol:'1 2 3 / 4 5 6 / 7 8 _',
  expl:'Das klassische 8er-Schiebepuzzle. Profis lösen es Reihe für Reihe.',
  render(b,api){let t,n;const ui=h('div');b.append(ui);const goal=[1,2,3,4,5,6,7,8,0];
    const nb=i=>{const r=Math.floor(i/3),c=i%3;return[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].filter(([y,x])=>y>=0&&y<3&&x>=0&&x<3).map(([y,x])=>y*3+x)};
    function reset(){t=goal.slice();let e=8,prev=-1;for(let k=0;k<80;k++){const m=pick(nb(e).filter(x=>x!==prev));t[e]=t[m];t[m]=0;prev=e;e=m}if(t.join()===goal.join())return reset();n=0;draw()}
    function draw(){ui.innerHTML='';const g=h('div',{class:'slide'});t.forEach((v,i)=>{const x=h('button',{class:'tile'+(v?'':' empty'),type:'button'},v?String(v):'');x.onclick=()=>{const e=t.indexOf(0);if(v&&nb(i).includes(e)){t[e]=v;t[i]=0;n++;draw();if(t.join()===goal.join())api.solve()}};g.append(x)});ui.append(g);
      const a=h('div',{class:'acts',style:'justify-content:center'});a.append(h('span',{class:'lbl'},`Züge: ${n}`));const r=h('button',{class:'hint',type:'button'},'↻ Neu mischen');r.onclick=reset;a.append(r);ui.append(a)}
    reset()}}
];

/* Multiple-Choice-Quizfrage; Tipps = Joker, die je eine falsche Antwort nennen */
function Q(q,right,wrongs,expl,o){o=o||{};
  return {onHint(k,box){box.querySelectorAll('.opt').forEach(x=>{if(x.textContent===wrongs[k]){x.disabled=true;x.classList.add('gone')}})},t:o.t||'',tag:o.tag||'Quiz',q,img:o.img,hints:[`Diese Antwort ist es nicht: „${wrongs[0]}“.`,`Diese auch nicht: „${wrongs[1]}“.`],sol:right,expl:expl||`Richtig: <b>${right}</b>.`,
    render(b,api){if(o.img)b.append(h('div',{class:'svgbox quizimg'},o.img));
      mc(b,api,'',[{t:right,ok:1}].concat(wrongs.map(w=>({t:w,why:pick(['Leider nein.','Knapp daneben.','Nope.','Das war nichts.','Falsch geraten.'])}))),()=>api.solve())}};
}

    say:(m,cls)=>{msg.className='msg '+(cls||'');msg.textContent=m}};

function nextIdx(S,i){for(let k=i+1;k<S.lv.length;k++)if(!R(S,k))return k;return firstOpen(S)}
function finishPanel(S,i,html,cls){
  const card=app.querySelector('.card');
  card.querySelectorAll('.box input,.box button,.tools button').forEach(x=>x.disabled=true);
  const t=card.querySelector('.tools');if(t)t.remove();card.querySelector('.msg').textContent='';

  b.onclick=()=>n===-1?showSetEnd(S):showSet(S,n);nx.append(b);card.append(nx);
  setTimeout(()=>b.focus({preventScroll:true}),50);p.scrollIntoView({behavior:'smooth',block:'nearest'});
  const dots=app.querySelectorAll('.map .dot');const r=R(S,i);if(dots[i]&&r)dots[i].classList.add(r.status);

}
function solve(S,i){
  if(solvedNow)return;solvedNow=true;runCleanup();
  const L=S.lv[i],pts=Math.max(10,100-25*hintsUsed-5*wrongs);
  const pr=R(S,i);const best=pr&&pr.status==='done'?Math.max(pr.pts,pts):pts;
  P.res[S.key+'-'+i]={status:'done',pts:best};save();
  finishPanel(S,i,`<div class="check">✓</div><div><b>Gelöst!</b> +${pts} Punkte${hintsUsed?` <span style="color:var(--muted)">(${hintsUsed} Tipp${hintsUsed>1?'s':''})</span>`:''}<p>${pf(L,'expl')}</p></div>`);
}
function skip(S,i){
  if(solvedNow)return;solvedNow=true;runCleanup();
  const L=S.lv[i];P.res[S.key+'-'+i]={status:'skipped',pts:0};save();
  finishPanel(S,i,`<div class="check">→</div><div><b>Übersprungen.</b> Lösung: ${pf(L,'sol')}<p>${pf(L,'expl')}</p></div>`,'skip');
}
function rankFor(pct){return pct>=.87?'Meisterin oder Meister der Seitenwege':pct>=.67?'Ausgezeichnet um die Ecke gedacht':pct>=.45?'Auf gutem Umweg':pct>=.2?'Die Ecken werden sichtbar':'Geradeausdenker, aber nicht mehr lange'}

/* Buchstabengitter */
function gameGrid(card){
  const WORDS=['SWARLEY','LEGENDARY','PUZZLES','MACLARENS','PINEAPPLE','SLAPBET','LAWYERED','SUITUP','ROBIN','BARNEY','MARSHALL','LILY','TED','GOAT'];
  const N=12,dirs=[[0,1],[1,0],[1,1],[-1,1]];let grid,placed,found,first;
  card.append(h('div',{class:'tag'},'<b>Buchstabengitter</b> · 14 Begriffe'),h('h2',{},'Wort-Suche'),
    h('p',{class:'q'},'Finde die versteckten Begriffe. Tippe auf den ersten und dann auf den letzten Buchstaben eines Wortes. Wörter laufen nach rechts, nach unten oder schräg.'));
  const wrap=h('div',{class:'wswrap'});const gEl=h('div',{class:'ws'});const list=h('div',{class:'wslist'});wrap.append(gEl,list);card.append(wrap);
  const bar=h('div',{class:'acts'});const nb=h('button',{class:'ghostbtn',type:'button'},'↻ Neues Gitter');nb.onclick=build;bar.append(nb);card.append(bar);
  function build(){
    card.querySelectorAll('.solved').forEach(x=>x.remove());
    for(let attempt=0;attempt<80;attempt++){grid=Array.from({length:N},()=>Array(N).fill(''));placed=[];let ok=true;
      for(const w of WORDS.slice().sort((a,b)=>b.length-a.length)){let done=false;
        for(let t=0;t<400&&!done;t++){const [dr,dc]=pick(dirs),r0=Math.floor(Math.random()*N),c0=Math.floor(Math.random()*N),r1=r0+dr*(w.length-1),c1=c0+dc*(w.length-1);
          if(r1<0||r1>=N||c1<0||c1>=N)continue;let fits=true;for(let i=0;i<w.length;i++){const ch=grid[r0+dr*i][c0+dc*i];if(ch&&ch!==w[i]){fits=false;break}}
          if(!fits)continue;for(let i=0;i<w.length;i++)grid[r0+dr*i][c0+dc*i]=w[i];placed.push({w,r0,c0,dr,dc});done=true}
        if(!done){ok=false;break}}
      if(ok)break}
    const A='ABCDEFGHIKLMNOPRSTUWY';for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])grid[r][c]=A[Math.floor(Math.random()*A.length)];
    found=new Set();first=null;draw();
  }
  function cellsOf(p){return Array.from({length:p.w.length},(_,i)=>(p.r0+p.dr*i)+','+(p.c0+p.dc*i))}
  function draw(){
    const hit=new Set();placed.filter(p=>found.has(p.w)).forEach(p=>cellsOf(p).forEach(x=>hit.add(x)));
    gEl.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const b=h('button',{type:'button',class:(hit.has(r+','+c)?'hit ':'')+(first&&first[0]===r&&first[1]===c?'sel':'')},grid[r][c]);b.onclick=()=>tap(r,c);gEl.append(b)}
    list.innerHTML=WORDS.map(w=>`<span class="${found.has(w)?'got':''}">${w}</span>`).join('')+`<p class="lbl" style="margin-top:10px">${found.size} / ${WORDS.length} gefunden</p>`;
  }
  function tap(r,c){
    if(!first){first=[r,c];draw();return}
    const [r0,c0]=first;first=null;const dr=Math.sign(r-r0),dc=Math.sign(c-c0),len=Math.max(Math.abs(r-r0),Math.abs(c-c0))+1;
    if(!(r===r0||c===c0||Math.abs(r-r0)===Math.abs(c-c0))||len<2){draw();return}
    let s='';for(let i=0;i<len;i++)s+=grid[r0+dr*i][c0+dc*i];
    const rev=s.split('').reverse().join('');
    const p=placed.find(p=>!found.has(p.w)&&(p.w===s||p.w===rev)&&(cellsOf(p).includes(r0+','+c0)&&cellsOf(p).includes(r+','+c)));
    if(p){found.add(p.w);draw();if(found.size===WORDS.length)gameWin(card,'Alle 14 Begriffe gefunden. Legen – wait for it – dary!')}else draw();
  }
  build();
}

/* Memory */
function gameMemory(card){
  const keys=['schirm','horn','ananas','ziege','krawatte','kuerbis','leuchtturm','kassette'];let cards,open,moves,matched,lock,t0,iv;
  card.append(h('div',{class:'tag'},'<b>Memory</b> · 8 Paare'),h('h2',{},'Requisiten-Memory'),h('p',{class:'q'},'Finde alle Paare aus Regenschirm, Waldhorn, Ananas und Co.'));
  const stat=h('div',{class:'lbl',style:'margin:10px 0'});const g=h('div',{class:'mem'});card.append(stat,g);
  const bar=h('div',{class:'acts'});const nb=h('button',{class:'ghostbtn',type:'button'},'↻ Neu mischen');nb.onclick=reset;bar.append(nb);card.append(bar);
  function reset(){clearInterval(iv);card.querySelectorAll('.solved').forEach(x=>x.remove());cards=shuffle(keys.concat(keys)).map(k=>({k,up:false,done:false}));open=[];moves=0;matched=0;lock=false;t0=0;draw();info()}
  function info(){const s=t0?Math.floor((Date.now()-t0)/1000):0;stat.textContent=`Züge: ${moves} · Paare: ${matched}/8 · Zeit: ${s} s`}
  function draw(){g.innerHTML='';cards.forEach((cd,i)=>{const b=h('button',{type:'button',class:'mcard'+(cd.up||cd.done?' up':'')+(cd.done?' done':'')},`<span class="back">☂</span><span class="front">${HG[cd.k]}</span>`);b.onclick=()=>flip(i);g.append(b)})}
  function flip(i){const cd=cards[i];if(lock||cd.up||cd.done)return;if(!t0){t0=Date.now();iv=setInterval(info,500)}
    cd.up=true;open.push(i);
    if(open.length===2){moves++;const [a,b]=open.map(j=>cards[j]);
      if(a.k===b.k){a.done=b.done=true;matched++;open=[];if(matched===8){clearInterval(iv);info();draw();gameWin(card,`Alle Paare in ${moves} Zügen gefunden.`);return}}
      else{lock=true;setTimeout(()=>{a.up=b.up=false;open=[];lock=false;draw()},900)}}
    info();draw()}
  cleanup=()=>clearInterval(iv);
  reset();
}

const CW_SMALL=[
  {d:'a',r:0,c:0,w:'FARHAMPTON',q:'Auf diesem Bahnsteig spricht Ted endlich die Mutter an.'},
  {d:'d',r:0,c:1,w:'ANANAS',q:'Diese Frucht findet Ted nach einer durchzechten Nacht in seinem Bett.'},
  {d:'d',r:0,c:5,w:'MARSHALL',q:'Teds bester Freund aus Minnesota.'},
  {d:'a',r:2,c:0,w:'CARL',q:'Der Barkeeper bei MacLaren’s.'},
  {d:'a',r:2,c:5,w:'ROBIN',q:'Kanadische Nachrichtenmoderatorin der Clique.'},
  {d:'a',r:5,c:3,w:'SWARLEY',q:'Barneys Spitzname, seit eine Barista seinen Namen falsch geschrieben hat.'},
  {d:'d',r:5,c:3,w:'SANDY',q:'Vorname von Robins eitlem Co-Moderator (… Rivers).'},
  {d:'a',r:7,c:5,w:'LILY',q:'Kindergärtnerin und Marshalls Frau.'}];
function gameCross(card,cfg){
  cfg=cfg||{key:'cw1',N:10,list:CW_SMALL,title:'HIMYM-Kreuzworträtsel',sub:'Kreuzworträtsel · 8 Begriffe',intro:'Umlaute gibt es hier keine. Tippe in ein Feld und schreib los.'};
  const N=cfg.N,CW=cfg.list.map(e=>Object.assign({},e));
  const sol=Array.from({length:N},()=>Array(N).fill(null));
  CW.forEach(e=>{for(let i=0;i<e.w.length;i++){const r=e.r+(e.d==='d'?i:0),c=e.c+(e.d==='a'?i:0);sol[r][c]=e.w[i]}});
  const starts=[...new Set(CW.map(e=>e.r*100+e.c))].sort((a,b)=>a-b);const nums={};starts.forEach((s,i)=>nums[Math.floor(s/100)+','+(s%100)]=i+1);
  CW.forEach(e=>e.n=nums[e.r+','+e.c]);
  const store=(P.games=P.games||{});const saved=store[cfg.key]||{};
  card.append(h('div',{class:'tag'},`<b>${cfg.sub}</b>`),h('h2',{},cfg.title),h('p',{class:'q'},cfg.intro));
  const wrap=h('div',{class:'cwwrap'});const scroll=h('div',{class:'cwscroll'});const gEl=h('div',{class:'cw'+(N>12?' big':''),style:`grid-template-columns:repeat(${N},${N>12?'30px':'1fr'})`});scroll.append(gEl);const clues=h('div',{class:'cwclues'});wrap.append(scroll,clues);card.append(wrap);
  const ins={};let dir='a',last=null;
  const persist=()=>{const o={};for(const k in ins)if(ins[k].value)o[k]=ins[k].value;store[cfg.key]=o;save()};
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!sol[r][c]){gEl.append(h('div',{class:'cwx'}));continue}
    const cell=h('div',{class:'cwc'});if(nums[r+','+c])cell.append(h('span',{class:'cwn'},String(nums[r+','+c])));
    const inp=h('input',{maxlength:'1',autocomplete:'off',autocapitalize:'characters',spellcheck:'false','aria-label':`Feld ${r+1}/${c+1}`});inp.value=saved[r+','+c]||'';ins[r+','+c]=inp;cell.append(inp);gEl.append(cell);
    inp.addEventListener('focus',()=>{inp.select();last=r+','+c});
    inp.addEventListener('input',()=>{inp.value=inp.value.toUpperCase().replace(/Ä/g,'A').replace(/Ö/g,'O').replace(/Ü/g,'U').replace(/[^A-Z]/g,'').slice(-1);cell.classList.remove('bad','ok');persist();
      if(inp.value){const nx=dir==='a'?ins[r+','+(c+1)]:ins[(r+1)+','+c];const alt=dir==='a'?ins[(r+1)+','+c]:ins[r+','+(c+1)];if(nx)nx.focus();else if(alt){dir=dir==='a'?'d':'a';alt.focus()}}});
    inp.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!inp.value){const pv=dir==='a'?ins[r+','+(c-1)]:ins[(r-1)+','+c];if(pv){pv.focus();pv.value='';persist()}}
      const mv={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[e.key];if(mv){e.preventDefault();dir=mv[0]?'d':'a';let rr=r+mv[0],cc=c+mv[1];while(rr>=0&&cc>=0&&rr<N&&cc<N&&!ins[rr+','+cc]){rr+=mv[0];cc+=mv[1]}if(ins[rr+','+cc])ins[rr+','+cc].focus()}});
  }
  const mk=(d,t)=>`<h4>${t}</h4>`+CW.filter(e=>e.d===d).sort((a,b)=>a.n-b.n).map(e=>`<p data-k="${e.d}${e.n}"><b>${e.n}</b> ${e.q} <span class="lbl">(${e.w.length})</span></p>`).join('');
  clues.innerHTML=mk('a','Waagerecht')+mk('d','Senkrecht');
  clues.querySelectorAll('p').forEach(p=>p.onclick=()=>{const e=CW.find(x=>x.d+x.n===p.dataset.k);dir=e.d;ins[e.r+','+e.c].focus();ins[e.r+','+e.c].scrollIntoView({block:'nearest',inline:'center'})});
  const bar=h('div',{class:'acts'});const ck=h('button',{class:'primary',type:'button'},'Prüfen');const hint=h('button',{class:'ghostbtn',type:'button'},'Buchstabe aufdecken');const rs=h('button',{class:'hint',type:'button'},'Alles leeren');bar.append(ck,hint,rs);card.append(bar);
  const msg=h('div',{class:'msg'});card.append(msg);
  const total=Object.keys(ins).length;
  ck.onclick=()=>{let all=true,empty=0,wrong=0;for(const k in ins){const [r,c]=k.split(',').map(Number);const v=ins[k].value,cell=ins[k].parentNode;cell.classList.remove('bad','ok');if(!v){empty++;all=false;continue}if(v===sol[r][c])cell.classList.add('ok');else{cell.classList.add('bad');wrong++;all=false}}
    msg.className='msg';card.querySelectorAll('.solved').forEach(x=>x.remove());
    if(all){msg.textContent='';gameWin(card,`Alle ${CW.length} Begriffe gelöst${store[cfg.key+'_hints']?` (mit ${store[cfg.key+'_hints']} aufgedeckten Buchstaben)`:''}. Legendär!`)}
    else msg.textContent=`${total-empty-wrong} von ${total} Feldern richtig${wrong?`, ${wrong} falsch (rot)`:''}${empty?`, ${empty} noch leer`:''}.`};
  hint.onclick=()=>{let k=last;if(!k||ins[k].value===sol[+k.split(',')[0]][+k.split(',')[1]]){k=Object.keys(ins).find(x=>{const [r,c]=x.split(',').map(Number);return ins[x].value!==sol[r][c]})}
    if(!k){msg.className='msg info';msg.textContent='Alles ist schon richtig.';return}
    const [r,c]=k.split(',').map(Number);ins[k].value=sol[r][c];ins[k].parentNode.classList.remove('bad');ins[k].parentNode.classList.add('ok');store[cfg.key+'_hints']=(store[cfg.key+'_hints']||0)+1;persist();ins[k].focus()};
  let armed=false;rs.onclick=()=>{if(!armed){armed=true;rs.textContent='Wirklich alles leeren?';return}armed=false;rs.textContent='Alles leeren';for(const k in ins){ins[k].value='';ins[k].parentNode.classList.remove('bad','ok')}store[cfg.key+'_hints']=0;persist();msg.textContent='';card.querySelectorAll('.solved').forEach(x=>x.remove())};
}
